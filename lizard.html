<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手扮樹枝 - 蜥蜴寫真相機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden bg-slate-950 text-slate-100">

    <header class="w-full py-4 px-6 glass-panel border-b border-slate-800 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-emerald-500/20 border border-emerald-500 flex items-center justify-center text-emerald-400">
                <i class="fa-solid font-bold text-xl fa-worm"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">手扮樹枝 · 蜥蜴寫真</h1>
                <p class="text-xs text-slate-400">伸出雙手扮樹枝，讓可愛蜥蜴棲息在手掌上！</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
        <div class="lg:col-span-2 flex flex-col items-center gap-4">
            <div id="viewport-box" class="w-full relative rounded-2xl overflow-hidden bg-slate-900 border border-slate-800 shadow-2xl aspect-[4/3] flex items-center justify-center">
                <video id="webcam-video" autoplay playsinline class="hidden"></video>
                <canvas id="app-canvas" class="w-full h-full object-contain cursor-grab active:cursor-grabbing"></canvas>

                <div id="camera-prompt" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 p-6 text-center z-10">
                    <div class="w-20 h-20 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-4 text-emerald-400 text-3xl animate-pulse">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <h2 class="text-2xl font-bold mb-2">準備開始拍照</h2>
                    <p class="text-slate-400 max-w-md text-sm mb-6">請點擊下方按鈕允許存取攝影機，並伸出手臂做出樹枝姿勢。</p>
                    <button id="start-cam-btn" class="px-6 py-3 rounded-xl font-bold bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white shadow-lg shadow-emerald-500/25 transition transform hover:scale-105 active:scale-95 flex items-center gap-2">
                        <i class="fa-solid fa-video"></i> 開啟攝影機
                    </button>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4 w-full p-3 glass-panel rounded-2xl">
                <button id="capture-btn" disabled class="px-8 py-3 rounded-xl font-bold bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed text-slate-950 shadow-lg shadow-emerald-500/20 transition flex items-center gap-2 text-lg">
                    <i class="fa-solid fa-camera-retro"></i> 拍攝照片
                </button>
                <a id="download-link" class="hidden px-6 py-3 rounded-xl font-bold bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white shadow-lg shadow-cyan-500/25 transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> 下載相片
                </a>
            </div>
        </div>

        <div class="glass-panel p-5 rounded-2xl flex flex-col gap-6 border border-slate-800">
            <h3 class="text-sm uppercase tracking-wider text-slate-400 font-bold flex items-center gap-2">
                <i class="fa-solid fa-sliders text-emerald-400"></i> 調整姿態
            </h3>

            <div>
                <div class="flex justify-between text-xs text-slate-300 mb-1">
                    <span>大小尺寸</span>
                    <span id="scale-val" class="text-emerald-400 font-mono">1.0x</span>
                </div>
                <input type="range" id="scale-slider" min="0.3" max="3.0" step="0.05" value="1.0" class="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg">
            </div>

            <div>
                <div class="flex justify-between text-xs text-slate-300 mb-1">
                    <span>旋轉角度</span>
                    <span id="rotate-val" class="text-emerald-400 font-mono">0°</span>
                </div>
                <input type="range" id="rotate-slider" min="-180" max="180" step="1" value="0" class="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg">
            </div>

            <button id="flip-btn" class="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium border border-slate-700 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-left text-emerald-400"></i> 左右鏡像翻轉
            </button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('webcam-video');
            const canvas = document.getElementById('app-canvas');
            const ctx = canvas.getContext('2d');
            const startCamBtn = document.getElementById('start-cam-btn');
            const cameraPrompt = document.getElementById('camera-prompt');
            const captureBtn = document.getElementById('capture-btn');
            const downloadLink = document.getElementById('download-link');
            
            const scaleSlider = document.getElementById('scale-slider');
            const rotateSlider = document.getElementById('rotate-slider');
            const flipBtn = document.getElementById('flip-btn');

            let lizardImg = new Image();
            let isCamActive = false;
            let transform = { x: 0, y: 0, scale: 1.0, rotate: 0, flipX: false };

            // 變色龍向量 SVG
            const lizardSVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180"><g transform="translate(20,20)"><path d="M 50 110 C 20 110 10 70 30 50 C 45 35 65 50 55 65" fill="none" stroke="%2316a34a" stroke-width="14" stroke-linecap="round"/><ellipse cx="120" cy="100" rx="65" ry="35" fill="%2322c55e"/><path d="M 160 95 C 160 60 185 40 210 65 L 230 85 C 240 95 230 115 200 115 Z" fill="%2316a34a"/><circle cx="205" cy="85" r="12" fill="%23facc15"/><circle cx="207" cy="84" r="5" fill="%23000"/></g></svg>`;
            lizardImg.src = lizardSVG;

            function resizeCanvas() {
                canvas.width = canvas.clientWidth || 640;
                canvas.height = canvas.clientHeight || 480;
                if (!transform.x) transform.x = canvas.width / 2;
                if (!transform.y) transform.y = canvas.height / 2;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // 啟動鏡頭事件
            startCamBtn.addEventListener('click', async () => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('您的瀏覽器不支援攝影機 API，請確認網址是否為 https:// 格式！');
                    return;
                }

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                        audio: false
                    });
                    video.srcObject = stream;
                    await video.play();
                    isCamActive = true;
                    cameraPrompt.classList.add('hidden');
                    captureBtn.disabled = false;
                    requestAnimationFrame(renderLoop);
                } catch (err) {
                    alert('無法啟動攝影機！請檢查是否允許了鏡頭權限，或確認網址為 https:// 開頭。\n錯誤訊息: ' + err.name + ' - ' + err.message);
                }
            });

            function renderLoop() {
                if (!isCamActive) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 畫鏡頭影像 (水平翻轉)
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.restore();

                // 畫蜥蜴
                if (lizardImg.complete) {
                    ctx.save();
                    ctx.translate(transform.x, transform.y);
                    ctx.rotate((transform.rotate * Math.PI) / 180);
                    ctx.scale(transform.flipX ? -transform.scale : transform.scale, transform.scale);
                    ctx.drawImage(lizardImg, -150, -90, 300, 180);
                    ctx.restore();
                }

                requestAnimationFrame(renderLoop);
            }

            // 控制控制項
            scaleSlider.addEventListener('input', (e) => {
                transform.scale = parseFloat(e.target.value);
                document.getElementById('scale-val').innerText = transform.scale.toFixed(1) + 'x';
            });

            rotateSlider.addEventListener('input', (e) => {
                transform.rotate = parseInt(e.target.value);
                document.getElementById('rotate-val').innerText = transform.rotate + '°';
            });

            flipBtn.addEventListener('click', () => {
                transform.flipX = !transform.flipX;
            });

            // 拖曳蜥蜴
            let isDragging = false;
            canvas.addEventListener('pointerdown', () => isDragging = true);
            canvas.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const rect = canvas.getBoundingClientRect();
                transform.x = e.clientX - rect.left;
                transform.y = e.clientY - rect.top;
            });
            window.addEventListener('pointerup', () => isDragging = false);

            // 拍照與下載
            captureBtn.addEventListener('click', () => {
                const dataUrl = canvas.toDataURL('image/png');
                downloadLink.href = dataUrl;
                downloadLink.download = 'hand-lizard.png';
                downloadLink.classList.remove('hidden');
                alert('照片已成功擷取！可以點擊「下載相片」保存。');
            });
        });
    </script>
</body>  
</html>
