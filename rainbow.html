<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR 擲彩虹 WebXR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* AR DOM Overlay */
    #xr-overlay {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: space-between; align-items: center;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(35px, env(safe-area-inset-bottom));
      padding-left: 20px; padding-right: 20px;
      pointer-events: none;
    }

    .interactive { pointer-events: auto; }

    #top-hud {
      display: flex; justify-content: space-between; width: 100%;
      background: rgba(0, 0, 0, 0.7); color: #fff;
      padding: 15px 20px; border-radius: 15px;
      font-size: 18px; font-weight: bold; backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    #info-card {
      background: rgba(0, 0, 0, 0.85); color: #ffcc00;
      padding: 14px 22px; border-radius: 20px;
      font-size: 16px; font-weight: bold; text-align: center;
      max-width: 90%; backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      margin-bottom: 20px;
    }

    #controls {
      display: flex; gap: 12px; width: 100%;
      max-width: 400px; justify-content: center;
      margin-bottom: 5px;
    }

    .btn {
      flex: 1; padding: 16px 10px; font-size: 18px; font-weight: 900;
      color: #fff; border: none; border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; text-align: center;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.95); }

    #btn-start { background: #007bff; width: 100%; max-width: 260px; }
    #btn-place-rainbow { background: #ff0055; display: none; }
    #btn-throw { background: #00cc66; display: none; font-size: 22px;}
    #btn-reset { background: #ffcc00; color: #000; display: none; }

  </style>

  <!-- Three.js 庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- AR DOM Overlay -->
  <div id="xr-overlay">
    <div id="top-hud" class="interactive">
      <div>金幣: <span id="coin-count">10</span></div>
      <div>分數: <span id="score">0</span></div>
    </div>
    
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div id="info-card">請點擊下方「開啟 AR 鏡頭」按鈕</div>
      <div id="controls" class="interactive">
        <button id="btn-start" class="btn">開啟 AR 鏡頭</button>
        <button id="btn-place-rainbow" class="btn">1. 在此放置彩虹</button>
        <button id="btn-throw" class="btn">🪙 擲硬幣</button>
        <button id="btn-reset" class="btn">重新擺放</button>
      </div>
    </div>
  </div>

  <script>
    let camera, scene, renderer;
    let xrRefSpace, hitTestSource = null;
    let reticle;
    let rainbowGroup = null;
    let activeCoins = []; // 儲存飛行中的硬幣

    let gameState = 'IDLE'; // IDLE, SCANNING, PLAYING
    let coinsLeft = 10;
    let totalScore = 0;

    const COIN_RADIUS = 0.04; // 硬幣半徑 4cm

    const btnStart = document.getElementById('btn-start');
    const btnPlaceRainbow = document.getElementById('btn-place-rainbow');
    const btnThrow = document.getElementById('btn-throw');
    const btnReset = document.getElementById('btn-reset');
    const infoCard = document.getElementById('info-card');
    const overlay = document.getElementById('xr-overlay');

    window.addEventListener('DOMContentLoaded', () => {
      if (!window.isSecureContext || !navigator.xr) {
        infoCard.style.color = '#ff6b6b';
        infoCard.innerText = "❌ 錯誤：請使用支援 WebXR 的 HTTPS 環境";
        btnStart.disabled = true;
      }
    });

    btnStart.addEventListener('click', async () => {
      try {
        infoCard.innerText = "正在啟動 AR...";

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // 地面瞄準環
        const ringGeo = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        reticle = new THREE.Mesh(ringGeo, ringMat);
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // 使用你成功開啟的 session 設定
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local-floor'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: overlay }
        });

        renderer.xr.setSession(session);

        btnStart.style.display = 'none';
        btnPlaceRainbow.style.display = 'block';
        gameState = 'SCANNING';
        infoCard.innerText = "請緩慢移動手機掃描地面，直到出現綠色圓環";

        const viewerSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
        xrRefSpace = await session.requestReferenceSpace('local-floor');

        renderer.setAnimationLoop(renderLoop);

      } catch (err) {
        infoCard.innerText = "啟動 AR 失敗: " + err.message;
      }
    });

    // 建立 3D 彩虹圖案
    function createRainbow() {
      const group = new THREE.Group();
      const colors = [0x2196f3, 0xf44336, 0xffeb3b, 0x4caf50];
      // 內徑與外徑 [min, max]
      const radii = [
        [0.20, 0.35], // 藍
        [0.37, 0.52], // 紅
        [0.54, 0.69], // 黃
        [0.71, 0.86]  // 綠
      ];

      for (let i = 0; i < 4; i++) {
        // 彩色區域
        const geo = new THREE.RingGeometry(radii[i][0], radii[i][1], 64, 1, 0, Math.PI);
        const mat = new THREE.MeshBasicMaterial({ color: colors[i], side: THREE.DoubleSide });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        group.add(mesh);

        // 黑色分隔線 (死穴)
        const lineGeo = new THREE.RingGeometry(radii[i][1], radii[i][1] + 0.02, 64, 1, 0, Math.PI);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
        const lineMesh = new THREE.Mesh(lineGeo, lineMat);
        lineMesh.rotation.x = -Math.PI / 2;
        group.add(lineMesh);
      }
      return group;
    }

    btnPlaceRainbow.addEventListener('click', () => {
      if (reticle && reticle.visible) {
        rainbowGroup = createRainbow();
        // 將彩虹放置在瞄準環位置
        rainbowGroup.position.setFromMatrixPosition(reticle.matrix);
        
        // 讓彩虹面朝相機
        const camPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
        rainbowGroup.lookAt(camPos.x, rainbowGroup.position.y, camPos.z);
        
        scene.add(rainbowGroup);

        btnPlaceRainbow.style.display = 'none';
        btnThrow.style.display = 'block';
        btnReset.style.display = 'block';
        gameState = 'PLAYING';

        infoCard.innerText = "🎯 準備完成！對準彩虹，按下「擲硬幣」";
        infoCard.style.color = "#00ff88";
      } else {
        alert("未偵測到地面！請先將相機對準地面。");
      }
    });

    btnThrow.addEventListener('click', () => {
      if (gameState !== 'PLAYING' || coinsLeft <= 0) return;

      coinsLeft--;
      document.getElementById('coin-count').innerText = coinsLeft;

      // 取得相機位置
      const startPos = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
      startPos.y -= 0.1; // 從手機稍微下方丟出

      // 計算目標落點 (彩虹中心點加上隨機偏移，模擬人手誤差)
      const targetPos = rainbowGroup.position.clone();
      targetPos.x += (Math.random() - 0.5) * 1.5;
      targetPos.z += (Math.random() - 0.5) * 1.5;

      // 建立硬幣
      const coinGeo = new THREE.CylinderGeometry(COIN_RADIUS, COIN_RADIUS, 0.01, 16);
      const coinMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.3, metalness: 0.8 });
      const coinMesh = new THREE.Mesh(coinGeo, coinMat);
      coinMesh.position.copy(startPos);
      scene.add(coinMesh);

      // 加入動畫佇列
      activeCoins.push({
        mesh: coinMesh,
        start: startPos,
        target: targetPos,
        progress: 0,
        speed: 0.02 + (Math.random() * 0.01) // 飛行速度
      });

      if (coinsLeft === 0) {
        btnThrow.style.display = 'none';
      }
    });

    btnReset.addEventListener('click', () => {
      if (rainbowGroup) scene.remove(rainbowGroup);
      activeCoins.forEach(c => scene.remove(c.mesh));
      activeCoins = [];
      
      coinsLeft = 10;
      totalScore = 0;
      document.getElementById('coin-count').innerText = coinsLeft;
      document.getElementById('score').innerText = totalScore;
      
      btnReset.style.display = 'none';
      btnThrow.style.display = 'none';
      btnPlaceRainbow.style.display = 'block';
      gameState = 'SCANNING';
      infoCard.innerText = "請掃描地面，準備重新放置彩虹";
      infoCard.style.color = "#ffcc00";
    });

    // 動畫與渲染迴圈
    function renderLoop(timestamp, frame) {
      // 1. 地面偵測 (Hit Test)
      if (frame && gameState === 'SCANNING') {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(xrRefSpace);
          reticle.visible = true;
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      } else {
        reticle.visible = false;
      }

      // 2. 硬幣飛行物理動畫
      for (let i = activeCoins.length - 1; i >= 0; i--) {
        let coin = activeCoins[i];
        if (coin.progress < 1) {
          coin.progress += coin.speed;
          if (coin.progress > 1) coin.progress = 1;

          // 線性插值計算 X, Z
          coin.mesh.position.lerpVectors(coin.start, coin.target, coin.progress);
          
          // 加上拋物線高度 Y (利用 sin 函數)
          const parabolaHeight = Math.sin(coin.progress * Math.PI) * 0.6;
          coin.mesh.position.y += parabolaHeight;

          // 旋轉動畫
          coin.mesh.rotation.x += 0.4;
          coin.mesh.rotation.z += 0.2;

          // 落地結算
          if (coin.progress === 1) {
            coin.mesh.position.copy(coin.target); // 貼齊地面
            coin.mesh.rotation.set(0, 0, 0); // 平放
            evaluateScore(coin.target, coin.mesh);
          }
        }
      }

      renderer.render(scene, camera);
    }

    // 計算得分
    function evaluateScore(pos, coinMesh) {
      // 計算落點與彩虹中心的平面距離
      const center = rainbowGroup.position;
      const dx = pos.x - center.x;
      const dz = pos.z - center.z;
      
      // 判斷是否落在彩虹的半圓範圍內 (Z 必須大於等於中心點)
      // 因為彩虹圖案建立時轉了 -Math.PI/2，且畫的是 0 到 Math.PI，需計算局部座標
      const localPos = rainbowGroup.worldToLocal(pos.clone());
      if (localPos.y < 0) {
        infoCard.innerText = "出界！投到彩虹後方 ❌";
        coinMesh.material.color.setHex(0x555555);
        checkGameOver();
        return;
      }

      const dist = Math.hypot(localPos.x, localPos.y);

      // 與 createRainbow 裡的 radii 對應
      const bands = [
        { min: 0.20, max: 0.35, pts: 100 }, // 藍
        { min: 0.37, max: 0.52, pts: 50 },  // 紅
        { min: 0.54, max: 0.69, pts: 20 },  // 黃
        { min: 0.71, max: 0.86, pts: 10 }   // 綠
      ];

      let hit = null;
      let isTouchLine = false;

      for (let b of bands) {
        if (dist >= b.min && dist <= b.max) {
          hit = b;
          // 壓線判定 (距離黑色邊緣小於硬幣半徑)
          if ((dist - COIN_RADIUS < b.min) || (dist + COIN_RADIUS > b.max)) {
            isTouchLine = true;
          }
          break;
        }
      }

      if (!hit) {
        infoCard.innerText = "出界！沒中 ❌";
        coinMesh.material.color.setHex(0x555555);
      } else if (isTouchLine) {
        infoCard.innerText = "壓線！太可惜了 ⚠️";
        coinMesh.material.color.setHex(0xff0000);
      } else {
        totalScore += hit.pts;
        document.getElementById('score').innerText = totalScore;
        infoCard.innerText = `🎉 中獎！獲得 ${hit.pts} 分！`;
        coinMesh.material.color.setHex(0x00ff00);
      }
      
      checkGameOver();
    }

    function checkGameOver() {
      if (coinsLeft === 0) {
        setTimeout(() => {
          infoCard.innerText = `🏆 遊戲結束！總得分：${totalScore} 分`;
          infoCard.style.color = "#ffcc00";
        }, 1500);
      }
    }
  </script>
</body>
</html>
