<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 空間 AR 擲彩虹 🌈</title>
    <!-- 引入 A-Frame 網頁 3D/AR 引擎 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; background-color: #000; }

        /* UI 介面圖層 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex; justify-content: space-between;
            color: #fff; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
        }
        #msg {
            text-align: center; color: #ffeb3b; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9); margin-bottom: 20px;
        }
        #throw-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            pointer-events: auto; background: #ff0055; color: white;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 50px; box-shadow: 0 5px 20px rgba(255,0,85,0.6);
            cursor: pointer; display: none;
        }
        #start-ar-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: #00e676; color: #000; font-size: 22px; font-weight: bold;
            padding: 18px 36px; border-radius: 50px; border: none; cursor: pointer;
            box-shadow: 0 0 25px rgba(0,230,118,0.9);
        }
    </style>
</head>
<body>

    <button id="start-ar-btn" onclick="initARGame()">🚀 啟動 3D 空間 AR 模式</button>

    <div id="ui-layer">
        <div class="hud">
            <div>金幣：<span id="coins">5</span> / 5</div>
            <div>得分：<span id="score">0</span></div>
        </div>
        <div id="msg">請點擊上方按鈕啟動 AR 鏡頭！</div>
    </div>

    <button id="throw-btn" onclick="throwCoin()">擲硬幣 🪙</button>

    <!-- A-Frame 3D 空間場景 -->
    <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <!-- AR 鏡頭與陀螺儀追蹤 -->
        <a-entity id="camera" camera look-controls position="0 1.6 0"></a-entity>

        <!-- 固定在真實 3D 空間原點的彩虹 (桌面) -->
        <a-entity id="rainbow-group" position="0 0.2 -1.8" rotation="-70 0 0">
            <!-- 藍彩 100分 -->
            <a-ring color="#2196f3" radius-inner="0.25" radius-outer="0.4" theta-length="180" rotation="0 0 -90"></a-ring>
            <a-ring color="#000000" radius-inner="0.395" radius-outer="0.405" theta-length="180" rotation="0 0 -90"></a-ring>
            
            <!-- 紅彩 50分 -->
            <a-ring color="#f44336" radius-inner="0.42" radius-outer="0.57" theta-length="180" rotation="0 0 -90"></a-ring>
            <a-ring color="#000000" radius-inner="0.565" radius-outer="0.575" theta-length="180" rotation="0 0 -90"></a-ring>
            
            <!-- 黃彩 20分 -->
            <a-ring color="#ffeb3b" radius-inner="0.59" radius-outer="0.74" theta-length="180" rotation="0 0 -90"></a-ring>
            <a-ring color="#000000" radius-inner="0.735" radius-outer="0.745" theta-length="180" rotation="0 0 -90"></a-ring>
            
            <!-- 綠彩 10分 -->
            <a-ring color="#4caf50" radius-inner="0.76" radius-outer="0.91" theta-length="180" rotation="0 0 -90"></a-ring>
            <a-ring color="#000000" radius-inner="0.905" radius-outer="0.915" theta-length="180" rotation="0 0 -90"></a-ring>
        </a-entity>

        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
    </a-scene>

<script>
let coinsLeft = 5;
let score = 0;

async function initARGame() {
    const startBtn = document.getElementById('start-ar-btn');
    const throwBtn = document.getElementById('throw-btn');
    const msgEl = document.getElementById('msg');

    // 1. 請求 iPhone/Android 的陀螺儀 (Motion/Orientation) 權限
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
                alert('需要同意陀螺儀權限才能進行 3D 空間 AR 定位！');
                return;
            }
        } catch (e) {
            console.error(e);
        }
    }

    // 2. 開啟實境鏡頭
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });

        // 將鏡頭畫面設為 A-Frame 背景
        const sceneEl = document.querySelector('a-scene');
        let videoEl = document.createElement('video');
        videoEl.style.position = 'absolute';
        videoEl.style.top = '0'; videoEl.style.left = '0';
        videoEl.style.width = '100vw'; videoEl.style.height = '100vh';
        videoEl.style.objectFit = 'cover';
        videoEl.style.zIndex = '-1';
        videoEl.autoplay = true; videoEl.playsInline = true;
        videoEl.srcObject = stream;
        document.body.appendChild(videoEl);

        startBtn.style.display = 'none';
        throwBtn.style.display = 'block';
        msgEl.innerText = "對準桌面，按下「擲硬幣」！🪙";

    } catch (err) {
        alert("無法啟動相機！請確認使用 https:// 網址，並允許相機權限。");
        console.error(err);
    }
}

function throwCoin() {
    if (coinsLeft <= 0) return;

    coinsLeft--;
    document.getElementById('coins').innerText = coinsLeft;

    const scene = document.querySelector('a-scene');
    const cameraEl = document.getElementById('camera');

    // 取得相機目前的 3D 空間位置
    const camPos = cameraEl.object3D.position;

    // 建立 3D 實體金色硬幣
    const coin = document.createElement('a-cylinder');
    coin.setAttribute('color', '#FFD700');
    coin.setAttribute('height', '0.02');
    coin.setAttribute('radius', '0.07');
    coin.setAttribute('position', `${camPos.x} ${camPos.y - 0.2} ${camPos.z - 0.5}`);

    scene.appendChild(coin);

    // 3D 隨機落點 (目標：彩虹區域)
    const targetX = (Math.random() - 0.5) * 1.4;
    const targetZ = -1.8 + (Math.random() - 0.5) * 0.8;
    const targetY = 0.2;

    // 拋物線飛出動畫
    coin.setAttribute('animation__pos', {
        property: 'position',
        to: `${targetX} ${targetY} ${targetZ}`,
        dur: 700,
        easing: 'easeOutQuad'
    });

    coin.setAttribute('animation__rot', {
        property: 'rotation',
        to: '720 360 0',
        dur: 700,
        easing: 'linear'
    });

    setTimeout(() => {
        evaluateARScore(targetX, targetZ, coin);
    }, 750);
}

function evaluateARScore(x, z, coinEl) {
    const msgEl = document.getElementById('msg');
    
    // 計算硬幣落點與彩虹中心 (0, 0, -1.8) 的 3D 幾何距離
    const dist = Math.hypot(x - 0, z - (-1.8));
    const coinR = 0.07; // 硬幣半徑 7cm

    // 彩虹 3D 壓線門檻
    const bands = [
        { min: 0.25, max: 0.40, pts: 100 },
        { min: 0.42, max: 0.57, pts: 50 },
        { min: 0.59, max: 0.74, pts: 20 },
        { min: 0.76, max: 0.91, pts: 10 }
    ];

    let hit = null;
    let isTouchLine = false;

    for (let b of bands) {
        if (dist >= b.min && dist <= b.max) {
            hit = b;
            // 壓線死穴判定 (硬幣邊緣碰觸黑色分界線)
            if ((dist - coinR < b.min + 0.015) || (dist + coinR > b.max - 0.015)) {
                isTouchLine = true;
            }
            break;
        }
    }

    if (!hit) {
        msgEl.innerText = "出界！沒擲中彩虹 ❌";
        coinEl.setAttribute('color', '#555555');
    } else if (isTouchLine) {
        msgEl.innerText = "慘！壓線算輸！⚠️";
        coinEl.setAttribute('color', '#FF0000'); // 壓線變紅
    } else {
        score += hit.pts;
        document.getElementById('score').innerText = score;
        msgEl.innerText = `🎉 中獎！獲得 ${hit.pts} 分！`;
        coinEl.setAttribute('color', '#00FF00'); // 成功變綠
    }

    if (coinsLeft === 0) {
        setTimeout(() => {
            msgEl.innerText = `🏆 遊戲結束！總得分：${score} 分`;
            document.getElementById('throw-btn').style.display = 'none';
        }, 1500);
    }
}
</script>
</body>
</html>
