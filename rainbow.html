<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 擲彩虹 (高相容鏡頭版) 🌈</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; font-family: Arial, sans-serif; }
        
        /* 鏡頭背景全螢幕 */
        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover; z-index: 1;
        }

        /* 3D Canvas 疊在鏡頭上方 */
        #three-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        /* UI 介面 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px;
        }
        .hud {
            display: flex; justify-content: space-between;
            color: #fff; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #msg {
            text-align: center; color: #ffeb3b; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin-bottom: 20px;
        }
        #throw-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            pointer-events: auto; background: #ff0055; color: white;
            border: none; padding: 15px 40px; font-size: 22px; font-weight: bold;
            border-radius: 50px; box-shadow: 0 5px 20px rgba(255,0,85,0.6);
            cursor: pointer;
        }
        #perm-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 20; background: #00e676; color: #000; font-size: 22px; font-weight: bold;
            padding: 20px 30px; border-radius: 50px; border: none; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,230,118,0.8);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 原生 WebCam Video -->
    <video id="webcam" autoplay playsinline muted></video>
    <!-- Three.js 繪圖板 -->
    <canvas id="three-canvas"></canvas>

    <button id="perm-btn" onclick="startCamera()">點擊開啟相機 📷</button>

    <div id="ui-layer">
        <div class="hud">
            <div>金幣：<span id="coins">5</span> / 5</div>
            <div>得分：<span id="score">0</span></div>
        </div>
        <div id="msg">請開啟鏡頭開始遊戲！</div>
    </div>

    <button id="throw-btn" style="display:none;" onclick="throwCoin()">擲硬幣 🪙</button>

<script>
let scene, camera, renderer;
let coinsLeft = 5;
let score = 0;
let rainbowGroup;

// 手動觸發鏡頭（解決手機瀏覽器自動播放限制）
async function startCamera() {
    const video = document.getElementById('webcam');
    const permBtn = document.getElementById('perm-btn');
    const msgEl = document.getElementById('msg');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
        });
        video.srcObject = stream;
        await video.play();

        permBtn.style.display = 'none';
        document.getElementById('throw-btn').style.display = 'block';
        msgEl.innerText = "對準桌面，按下「擲硬幣」！";

        initThreeJS();
    } catch (err) {
        alert("無法讀取鏡頭！請確認網址為 https:// 並在手機權限中允許使用相機。");
        console.error(err);
    }
}

function initThreeJS() {
    const canvas = document.getElementById('three-canvas');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 2);
    camera.lookAt(0, 0, -1);

    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // 光源
    const light = new THREE.AmbientLight(0xffffff, 1);
    scene.add(light);

    // 建立 3D 彩虹
    rainbowGroup = createRainbow();
    rainbowGroup.position.set(0, -0.5, -2);
    rainbowGroup.rotation.x = -Math.PI / 3; // 稍微傾斜貼地
    scene.add(rainbowGroup);

    window.addEventListener('resize', onWindowResize);
    animate();
}

function createRainbow() {
    const group = new THREE.Group();
    const bands = [
        { rIn: 0.3, rOut: 0.5, color: 0x2196f3, pts: 100 },
        { rIn: 0.52, rOut: 0.72, color: 0xf44336, pts: 50 },
        { rIn: 0.74, rOut: 0.94, color: 0xffeb3b, pts: 20 },
        { rIn: 0.96, rOut: 1.16, color: 0x4caf50, pts: 10 }
    ];

    bands.forEach(b => {
        const shape = new THREE.Shape();
        shape.absarc(0, 0, b.rOut, 0, Math.PI, false);
        shape.absarc(0, 0, b.rIn, Math.PI, 0, true);

        const geom = new THREE.ShapeGeometry(shape);
        const mat = new THREE.MeshBasicMaterial({ color: b.color, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const mesh = new THREE.Mesh(geom, mat);
        group.add(mesh);
    });

    return group;
}

function throwCoin() {
    if (coinsLeft <= 0) return;

    coinsLeft--;
    document.getElementById('coins').innerText = coinsLeft;

    const coinGeom = new THREE.CylinderGeometry(0.08, 0.08, 0.02, 32);
    const coinMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
    const coin = new THREE.Mesh(coinGeom, coinMat);

    // 起始位置
    coin.position.set(0, 0.5, 1);
    scene.add(coin);

    // 隨機落點
    const targetX = (Math.random() - 0.5) * 1.5;
    const targetZ = -2 + (Math.random() - 0.5) * 0.8;
    const targetY = -0.5;

    let progress = 0;
    const timer = setInterval(() => {
        progress += 0.05;
        coin.position.x = THREE.MathUtils.lerp(0, targetX, progress);
        coin.position.z = THREE.MathUtils.lerp(1, targetZ, progress);
        coin.position.y = THREE.MathUtils.lerp(0.5, targetY, progress) + Math.sin(progress * Math.PI) * 0.5;
        coin.rotation.x += 0.3;

        if (progress >= 1) {
            clearInterval(timer);
            coin.position.set(targetX, targetY, targetZ);
            evaluateScore(targetX, targetZ, coin);
        }
    }, 20);
}

function evaluateScore(x, z, coinMesh) {
    const msgEl = document.getElementById('msg');
    const dist = Math.hypot(x, z - (-2));
    const coinR = 0.08;

    const bands = [
        { min: 0.3, max: 0.5, pts: 100 },
        { min: 0.52, max: 0.72, pts: 50 },
        { min: 0.74, max: 0.94, pts: 20 },
        { min: 0.96, max: 1.16, pts: 10 }
    ];

    let hit = null;
    let isTouch = false;

    for (let b of bands) {
        if (dist >= b.min && dist <= b.max) {
            hit = b;
            if ((dist - coinR < b.min + 0.02) || (dist + coinR > b.max - 0.02)) {
                isTouch = true;
            }
            break;
        }
    }

    if (!hit) {
        msgEl.innerText = "出界！沒中彩虹 ❌";
        coinMesh.material.color.setHex(0x555555);
    } else if (isTouch) {
        msgEl.innerText = "慘！壓線不中！⚠️";
        coinMesh.material.color.setHex(0xff0000);
    } else {
        score += hit.pts;
        document.getElementById('score').innerText = score;
        msgEl.innerText = `🎉 中獎！獲得 ${hit.pts} 分！`;
        coinMesh.material.color.setHex(0x00ff00);
    }

    if (coinsLeft === 0) {
        setTimeout(() => {
            msgEl.innerText = `🏆 遊戲結束！最終得分：${score} 分`;
            document.getElementById('throw-btn').style.display = 'none';
        }, 1500);
    }
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    if (renderer) renderer.render(scene, camera);
}
</script>
</body>
</html>
