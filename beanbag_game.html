<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 豆袋投擲挑戰 (純前端對比版)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
        }
        /* UI 疊加層 */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .btn {
            background: #ff9800;
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.4);
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        
        #hud-board {
            position: absolute;
            top: 15px; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 22px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        #countdown-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 900;
            color: #00e676;
            text-shadow: 0 0 20px rgba(0,230,118,0.8);
            z-index: 12;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 頂部資訊欄 -->
        <div id="hud-board">
            <div>第 <span id="round-num">1</span> / 3 球</div>
            <div>總分: <span id="total-score">0</span></div>
        </div>

        <!-- 倒數數字顯示區 -->
        <div id="countdown-overlay"></div>

        <!-- 鏡頭與 AR 畫布 -->
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="arCanvas" width="640" height="480"></canvas>

        <!-- 開始簡介畫面 -->
        <div id="start-screen" class="overlay-screen">
            <h1 style="color: #ffeb3b; margin-bottom: 10px;">🎯 3球 AR 豆袋投擲賽</h1>
            <p style="font-size: 16px; line-height: 1.6; color: #ddd; max-width: 480px; margin-bottom: 25px;">
                【遊戲玩法】<br>
                1. 按下 Start 後系統會<b>自動鎖定乾淨背景</b>並顯示 AR 得分圈。<br>
                2. 每次有 <b>3 秒倒數時間</b>，倒數完畢請將豆袋拋入目標區。<br>
                3. 系統會比對落點並自動進行下一球，一共投擲 <b>3 球</b>！
            </p>
            <button class="btn" onclick="startGame()">Start 開始遊戲</button>
        </div>

        <!-- 結算畫面 -->
        <div id="end-screen" class="overlay-screen" style="display: none;">
            <h1 style="color: #00e676;">🏆 遊戲結束！</h1>
            <p style="font-size: 24px; margin: 15px 0;">最終總得分：<span id="final-score" style="color: #ffeb3b; font-weight: bold;">0</span> 分</p>
            <button class="btn" onclick="restartGame()">再玩一次 🔄</button>
        </div>
    </div>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('arCanvas');
const ctx = canvas.getContext('2d');

const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const countdownEl = document.getElementById('countdown-overlay');
const roundEl = document.getElementById('round-num');
const scoreEl = document.getElementById('total-score');
const finalScoreEl = document.getElementById('final-score');

let currentRound = 1;
let totalScore = 0;
let isPlaying = false;

let baseFrameData = null; // 背景基準影像資料
let particles = [];
let floatingTexts = [];

// 得分區域設定 (同心圓)
const targetZones = [
    { radius: 40,  score: 50, color: 'rgba(255, 87, 34, 0.45)', stroke: '#ff5722' },
    { radius: 90,  score: 20, color: 'rgba(255, 193, 7, 0.35)', stroke: '#ffc107' },
    { radius: 150, score: 10, color: 'rgba(76, 175, 80, 0.25)', stroke: '#4caf50' }
];
const center = { x: 320, y: 240 }; // 畫布中心

// Web Audio API 無需要載入外部音效檔
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'hit') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
    } else if (type === 'miss') {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'beep') {
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
}

// 啟動 WebCam
async function initCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    return new Promise(resolve => video.onloadedmetadata = resolve);
}

// 繪製 AR 畫布 (得分圈 + 特效)
function renderAR() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isPlaying) {
        // 畫 AR 得分圓環
        targetZones.slice().reverse().forEach(z => {
            ctx.beginPath();
            ctx.arc(center.x, center.y, z.radius, 0, Math.PI * 2);
            ctx.fillStyle = z.color;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = z.stroke;
            ctx.stroke();
            
            ctx.fillStyle = z.stroke;
            ctx.font = 'bold 14px Arial';
            ctx.fillText(`${z.score}分`, center.x - 12, center.y - z.radius + 18);
        });
    }

    // 更新粒子效果
    particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    });

    // 更新浮動文字
    floatingTexts.forEach((ft, i) => {
        ft.y += ft.vy; ft.life--;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 24px Arial';
        ctx.fillText(ft.text, ft.x - 40, ft.y);
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    });

    requestAnimationFrame(renderAR);
}

// 開始遊戲流程
async function startGame() {
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    currentRound = 1;
    totalScore = 0;
    roundEl.innerText = currentRound;
    scoreEl.innerText = totalScore;
    isPlaying = true;

    startNextRound();
}

// 重新開始
function restartGame() {
    startGame();
}

// 開啟新一輪 3 秒倒數與比對
function startNextRound() {
    roundEl.innerText = currentRound;
    countdownEl.innerText = "準備...";
    
    // 預留 1 秒讓玩家準備，隨後捕捉基準圖
    setTimeout(() => {
        captureBaseFrame(); // 鎖定背景畫面
        runCountdown(3, () => {
            // 倒數結束，給予 1.5 秒讓豆袋飛出並落地停穩
            countdownEl.innerText = "拋出！";
            setTimeout(() => {
                countdownEl.innerText = "";
                evaluateThrow(); // 對比畫面檢測落點
            }, 1500);
        });
    }, 1000);
}

// 倒數計時器
function runCountdown(seconds, onComplete) {
    let count = seconds;
    countdownEl.innerText = count;
    playSound('beep');

    const timer = setInterval(() => {
        count--;
        if (count > 0) {
            countdownEl.innerText = count;
            playSound('beep');
        } else {
            clearInterval(timer);
            onComplete();
        }
    }, 1000);
}

// 1. 抓取背景基準圖 (Base Frame)
function captureBaseFrame() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 640; tempCanvas.height = 480;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(video, 0, 0, 640, 480);
    baseFrameData = tempCtx.getImageData(0, 0, 640, 480).data;
}

// 2. 比對前後畫面，抓出豆袋落點重心
function evaluateThrow() {
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = 640; tempCanvas.height = 480;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(video, 0, 0, 640, 480);
    const currentFrameData = tempCtx.getImageData(0, 0, 640, 480).data;

    let totalX = 0, totalY = 0, diffPixelCount = 0;

    // 每隔 4 個像素採樣（提高執行效率）
    for (let y = 0; y < 480; y += 4) {
        for (let x = 0; x < 640; x += 4) {
            const idx = (y * 640 + x) * 4;
            const rDiff = Math.abs(currentFrameData[idx] - baseFrameData[idx]);
            const gDiff = Math.abs(currentFrameData[idx+1] - baseFrameData[idx+1]);
            const bDiff = Math.abs(currentFrameData[idx+2] - baseFrameData[idx+2]);

            // 若 RGB 差異總和過大，判定為新出現的物件 (豆袋)
            if (rDiff + gDiff + bDiff > 100) {
                totalX += x;
                totalY += y;
                diffPixelCount++;
            }
        }
    }

    // 計算落點並判定得分
    if (diffPixelCount > 15) { // 至少需有一定面積變化，避免光線雜訊
        const avgX = totalX / diffPixelCount;
        const avgY = totalY / diffPixelCount;
        processScore(avgX, avgY);
    } else {
        // 沒有檢測到明顯拋出物
        playSound('miss');
        floatingTexts.push({ text: '未檢測到落點！💪', x: center.x, y: center.y, vy: -1.5, life: 50, color: '#ff9800' });
        finishRound();
    }
}

// 3. 得分判定與特效
function processScore(x, y) {
    const dist = Math.hypot(x - center.x, y - center.y);
    let roundScore = 0;
    let hitZone = null;

    for (let zone of targetZones) {
        if (dist <= zone.radius) {
            roundScore = zone.score;
            hitZone = zone;
            break;
        }
    }

    if (roundScore > 0) {
        totalScore += roundScore;
        scoreEl.innerText = totalScore;
        playSound('hit');

        // 生成粒子特效
        for (let i = 0; i < 25; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 35, color: hitZone.stroke
            });
        }
        floatingTexts.push({ text: `+${roundScore}分 正中！`, x, y, vy: -1.5, life: 50, color: '#ffeb3b' });
    } else {
        playSound('miss');
        floatingTexts.push({ text: '未命中得分區！', x, y, vy: -1.5, life: 50, color: '#ff5722' });
    }

    finishRound();
}

// 4. 輪次切換與結算
function finishRound() {
    setTimeout(() => {
        if (currentRound < 3) {
            currentRound++;
            startNextRound();
        } else {
            // 3 球結束
            isPlaying = false;
            finalScoreEl.innerText = totalScore;
            endScreen.style.display = 'flex';
        }
    }, 2500); // 停留 2.5 秒觀看分數特效
}

// 啟動
window.onload = async () => {
    await initCamera();
    renderAR();
};
</script>
</body>
</html>
