<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 開合跳計數器 - MediaPipe Pose</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- MediaPipe Pose JS 相關 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
        }
        /* 鏡像翻轉預覽畫面，操作更直覺 */
        .mirror {
            transform: scaleX(-1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- 頂部標題區 -->
    <header class="w-full max-w-2xl text-center py-2">
        <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
            AI 智慧開合跳計數器
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">請將鏡頭對準全身，確保手腳完整入鏡</p>
    </header>

    <!-- 主要畫面區 (鏡頭 + 骨架 Canvas) -->
    <main class="relative w-full max-w-md aspect-[3/4] md:aspect-[4/3] bg-slate-950 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 my-2">
        <!-- 隱藏的原始 Video 串流 -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover mirror opacity-0" autoplay playsinline></video>
        
        <!-- 繪製骨架與影像的 Canvas -->
        <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover mirror"></canvas>

        <!-- 即時動態提示浮層 -->
        <div id="status-badge" class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-700 text-xs md:text-sm font-bold text-emerald-400 shadow-lg transition-all duration-300">
            準備開始 🚀
        </div>

        <!-- 載入中遮罩 -->
        <div id="loading" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-20 transition-opacity duration-500">
            <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-sm font-medium text-slate-300">正在啟動鏡頭與 AI 模型...</p>
        </div>
    </main>

    <!-- 數據面板區 -->
    <section class="w-full max-w-md grid grid-cols-2 gap-3 my-2">
        <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-xl p-3 text-center shadow-md">
            <div class="text-xs text-slate-400 font-medium">完成次數</div>
            <div id="count-display" class="text-4xl md:text-5xl font-black text-emerald-400 mt-1">0</div>
        </div>
        <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700 rounded-xl p-3 text-center shadow-md flex flex-col justify-between">
            <div class="text-xs text-slate-400 font-medium">動作狀態</div>
            <div id="pose-state" class="text-lg md:text-xl font-bold text-cyan-300 mt-1">靜止中</div>
            <button id="reset-btn" class="mt-2 text-xs bg-slate-700 hover:bg-slate-600 active:scale-95 transition text-slate-200 py-1 px-2 rounded-lg cursor-pointer">
                歸零重置
            </button>
        </div>
    </section>

    <!-- 底部版權或提示 -->
    <footer class="text-xs text-slate-500 py-1">
        Powered by Google MediaPipe & Tailwind CSS
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const countDisplay = document.getElementById('count-display');
        const poseStateDisplay = document.getElementById('pose-state');
        const statusBadge = document.getElementById('status-badge');
        const loadingOverlay = document.getElementById('loading');
        const resetBtn = document.getElementById('reset-btn');

        let jumpCount = 0;
        // 動作狀態機: 'CLOSED' (合攏/準備) 或 'OPEN' (張開)
        let currentState = 'CLOSED'; 
        let lastStateChangeTime = 0;

        // 重置按鈕事件
        resetBtn.addEventListener('click', () => {
            jumpCount = 0;
            currentState = 'CLOSED';
            countDisplay.innerText = jumpCount;
            poseStateDisplay.innerText = '已重置';
            statusBadge.innerText = '請準備 🚀';
            statusBadge.className = "absolute top-4 left-4 bg-slate-900/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-700 text-xs md:text-sm font-bold text-emerald-400 shadow-lg";
        });

        function onResults(results) {
            // 隱藏載入動畫
            if (loadingOverlay.style.opacity !== '0') {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.style.display = 'none', 500);
            }

            // 設定 Canvas 尺寸與影片一致
            if (canvasElement.width !== videoElement.videoWidth) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 繪製攝影機畫面
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                // 畫骨架與關節
                drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, {color: '#10B981', lineWidth: 4});
                drawLandmarks(canvasCtx, landmarks, {color: '#06B6D4', lineWidth: 2, radius: 4});

                // 取得關鍵點座標進行開合跳邏輯判斷
                // 參考點：
                // 11: 左肩膀, 12: 右肩膀
                // 15: 左手腕, 16: 右手腕
                // 23: 左髖部, 24: 右髖部
                // 27: 左腳踝, 28: 右腳踝
                const leftShoulder = landmarks[11];
                const rightShoulder = landmarks[12];
                const leftWrist = landmarks[15];
                const rightWrist = landmarks[16];
                const leftAnkle = landmarks[27];
                const rightAnkle = landmarks[28];
