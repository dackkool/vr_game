<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebXR 3D 擲彩虹 🌈</title>
    <style>
        body {
            margin: 0; overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }
        #overlay-ui {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between;
            color: #fff; font-size: 20px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10; pointer-events: none;
        }
        #msg-box {
            position: absolute; bottom: 80px; width: 100%;
            text-align: center; color: #ffeb3b; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10; pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 WebXR Button 輔助函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/ARButton.js"></script>
</head>
<body>

    <div id="overlay-ui">
        <div>金幣：<span id="coins-left">5</span> / 5</div>
        <div>得分：<span id="score">0</span></div>
    </div>
    <div id="msg-box">請將手機對準桌面，尋找地面錨點...</div>

<script>
let container, camera, scene, renderer;
let controller;
let reticle; // 用於提示桌平面定位的環形游標

let hitTestSource = null;
let hitTestSourceRequested = false;

let rainbowGroup = null;
let rainbowPlaced = false; // 是否已將彩虹放置於桌面上
let coinsLeft = 5;
let score = 0;

// 彩虹 3D 尺寸設定 (單位：米)
const rainbowBands = [
    { innerR: 0.10, outerR: 0.18, score: 100, color: 0x2196f3 }, // 藍彩 100分
    { innerR: 0.19, outerR: 0.27, score: 50,  color: 0xf44336 }, // 紅彩 50分
    { innerR: 0.28, outerR: 0.36, score: 20,  color: 0xffeb3b }, // 黃彩 20分
    { innerR: 0.37, outerR: 0.46, score: 10,  color: 0x4caf50 }  // 綠彩 10分
];
const borderLineWidth = 0.008; // 黑線寬度 8mm (用於壓線判定)

init();
animate();

function init() {
    container = document.createElement('div');
    document.body.appendChild(container);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    // 環境光與平行光
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    // Renderer 設定
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true; // 開啟 WebXR 功能
    container.appendChild(renderer.domElement);

    // 加入官方 AR 啟動按鈕 (會要求存取鏡頭與 AR 權限)
    document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

    // 建立 3D 瞄準標籤 (Reticle)，用於讓使用者選擇將彩虹放在桌面上哪裡
    reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.11, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00e676 })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // 控制器：綁定畫面觸控事件
    controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelect);
    scene.add(controller);

    window.addEventListener('resize', onWindowResize);
}

// 建立 3D 拱形彩虹模型 (貼於地面)
function create3DRainbow() {
    const group = new THREE.Group();

    rainbowBands.forEach(band => {
        // 建立半圓形環狀 Geometric Plane
        const shape = new THREE.Shape();
        shape.absarc(0, 0, band.outerR, 0, Math.PI, false);
        shape.absarc(0, 0, band.innerR, Math.PI, 0, true);

        const geometry = new THREE.ShapeGeometry(shape);
        geometry.rotateX(-Math.PI / 2); // 旋轉使其平行躺於地面

        const material = new THREE.MeshBasicMaterial({
            color: band.color,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85
        });
        const mesh = new THREE.Mesh(geometry, material);
        group.add(mesh);

        // 黑色分隔線 (壓線死穴)
        const outerLineGeom = new THREE.RingGeometry(band.outerR - borderLineWidth/2, band.outerR + borderLineWidth/2, 64);
        outerLineGeom.rotateX(-Math.PI / 2);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide });
        const outerLine = new THREE.Mesh(outerLineGeom, lineMat);
        group.add(outerLine);
    });

    return group;
}

// 點擊螢幕互動邏輯
function onSelect() {
    const msgBox = document.getElementById('msg-box');

    // 步驟 1：如果彩虹尚未放置，點擊時將彩虹固定在瞄準圈 (Reticle) 位置
    if (!rainbowPlaced && reticle.visible) {
        rainbowGroup = create3DRainbow();
        rainbowGroup.position.setFromMatrixPosition(reticle.matrix);
        // 使彩虹面向相機的方向
        const headPos = new THREE.Vector3();
        camera.getWorldPosition(headPos);
        rainbowGroup.lookAt(headPos.x, rainbowGroup.position.y, headPos.z);

        scene.add(rainbowGroup);
        rainbowPlaced = true;
        reticle.visible = false;
        msgBox.innerText = "彩虹已固定！點擊螢幕擲硬幣 🪙";
        return;
    }

    // 步驟 2：彩虹固定後，點擊螢幕進行「擲硬幣」
    if (rainbowPlaced && coinsLeft > 0) {
        throwCoin();
    }
}

// 3D 擲硬幣與落點物理計算
function throwCoin() {
    coinsLeft--;
    document.getElementById('coins-left').innerText = coinsLeft;

    // 1. 建立 3D 硬幣 (直徑 2.5cm 的金色圓柱體)
    const coinGeom = new THREE.CylinderGeometry(0.0125, 0.0125, 0.003, 32);
    const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
    const coin = new THREE.Mesh(coinGeom, coinMat);

    // 2. 設定硬幣起飛點（相機下方）
    const startPos = new THREE.Vector3();
    camera.getWorldPosition(startPos);
    coin.position.copy(startPos);
    scene.add(coin);

    // 3. 計算投擲目標點（彩虹中心附近的隨機落點，加上一點投擲偏差）
    const targetPos = new THREE.Vector3();
    rainbowGroup.getWorldPosition(targetPos);
    targetPos.x += (Math.random() - 0.5) * 0.4;
    targetPos.z += (Math.random() - 0.5) * 0.4;

    // 4. 動畫：將硬幣飛擲拋向地面 (簡單拋物線)
    let progress = 0;
    const throwInterval = setInterval(() => {
        progress += 0.04;
        coin.position.lerpVectors(startPos, targetPos, progress);
        coin.position.y = THREE.MathUtils.lerp(startPos.y, targetPos.y, progress) + Math.sin(progress * Math.PI) * 0.2; // 拋物線高度
        coin.rotation.x += 0.2;

        if (progress >= 1) {
            clearInterval(throwInterval);
            coin.position.copy(targetPos);
            coin.rotation.set(0, 0, 0); // 貼平地面
            evaluateXRScore(targetPos, coin);
        }
    }, 16);
}

// 3D 空間壓線與得分判斷
function evaluateXRScore(coinWorldPos, coinMesh) {
    const msgBox = document.getElementById('msg-box');
    
    // 計算硬幣落點相對於「彩虹中心」的 3D 距離 (離心距離)
    const rainbowWorldPos = new THREE.Vector3();
    rainbowGroup.getWorldPosition(rainbowWorldPos);
    
    // 計算水平距離 (X-Z 平面)
    const dx = coinWorldPos.x - rainbowWorldPos.x;
    const dz = coinWorldPos.z - rainbowWorldPos.z;
    const distToCenter = Math.hypot(dx, dz);

    const coinRadius = 0.0125; // 1.25 cm 硬幣半徑
    let hitBand = null;
    let isTouchLine = false;

    for (let band of rainbowBands) {
        if (distToCenter >= band.innerR && distToCenter <= band.outerR) {
            hitBand = band;
            // 壓線判定：硬幣邊緣碰觸到 innerR 或 outerR 邊界線
            if ((distToCenter - coinRadius < band.innerR + borderLineWidth/2) || 
                (distToCenter + coinRadius > band.outerR - borderLineWidth/2)) {
                isTouchLine = true;
            }
            break;
        }
    }

    if (!hitBand) {
        msgBox.innerText = "出界！沒擲中彩虹 ❌";
        coinMesh.material.color.setHex(0x555555);
    } else if (isTouchLine) {
        msgBox.innerText = "慘！壓線不中！⚠️";
        coinMesh.material.color.setHex(0xff0000); // 壓線硬幣變紅色提示
    } else {
        score += hitBand.score;
        document.getElementById('score').innerText = score;
        msgBox.innerText = `🎉 中獎！獲得 ${hitBand.score} 分！`;
        coinMesh.material.color.setHex(0x00ff00); // 成功硬幣變綠色
    }

    if (coinsLeft === 0) {
        setTimeout(() => {
            msgBox.innerText = `🏆 遊戲結束！最終得分：${score} 分`;
        }, 2000);
    }
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    renderer.setAnimationLoop(render);
}

// WebXR 主渲染循環與 Hit-Test 計算
function render(timestamp, frame) {
    if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        // 首次啟動 WebXR 時請求 hit-test source
        if (hitTestSourceRequested === false) {
            session.requestReferenceSpace('viewer').then((viewerSpace) => {
                session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                    hitTestSource = source;
                });
            });
            session.addEventListener('end', () => {
                hitTestSourceRequested = false;
                hitTestSource = null;
            });
            hitTestSourceRequested = true;
        }

        // 當彩虹還沒放置時，計算相機指向的真實地面，並移動瞄準圈 (Reticle)
        if (hitTestSource && !rainbowPlaced) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length > 0) {
                const hit = hitTestResults[0];
                const pose = hit.getPose(referenceSpace);

                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                document.getElementById('msg-box').innerText = "已找到平面！點擊螢幕放置彩虹 🌈";
            } else {
                reticle.visible = false;
                document.getElementById('msg-box').innerText = "尋找桌面中...請將鏡頭緩慢掃瞄地面";
            }
        }
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
