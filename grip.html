<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JX-180 握力計測試</title>
<style>
body{font-family:-apple-system,Arial;background:#f5f5f5;margin:0;padding:10px}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0}
.big{font-size:68px;font-weight:800;text-align:center}
button{width:100%;padding:14px;background:#00c853;color:#fff;border:0;border-radius:10px;font-size:18px;margin-top:8px}
.small{font-size:13px;color:#666;text-align:center}
input{width:100%;padding:10px;font-size:16px;box-sizing:border-box}
</style>
</head>
<body>
<div style="background:#111;color:#fff;padding:15px;text-align:center;font-size:18px">JX-180 手握計 <div id="time" style="font-size:12px"></div></div>
<div id="status" class="card" style="text-align:center">⚠️ 未連接<br>裝置: KC4101 / Service: FFE0 / Notify: FFE2 / Write: FFE1</div>
<button id="connBtn">🔵 1. 按呢度連接 KC4101</button>
<button id="discBtn" style="background:#ff9800">🧹 斷開 / 清零</button>

<div class="card">
<div style="text-align:center">而家握力 (估算)</div>
<div class="big"><span id="w">--</span><small style="font-size:20px">kg</small></div>
<div style="text-align:center">最大值: <span id="maxW">--</span>kg | 次數: <span id="count">0</span></div>
<div class="small">Raw: <span id="rawHex">--</span></div>
</div>

<div class="card">
<div><b>2. 試寫命令去 FFE1 (如果唔出數先試)</b></div>
<div style="display:flex;gap:6px;margin-top:8px">
<button onclick="sendHex('01')" style="background:#2196f3">寫 01</button>
<button onclick="sendHex('00')" style="background:#2196f3">寫 00</button>
<button onclick="sendHex('A0')" style="background:#2196f3">寫 A0</button>
<button onclick="sendHex('AA550100')" style="background:#2196f3">寫 AA55</button>
</div>
<div style="margin-top:8px"><input id="customHex" placeholder="自訂 Hex，例如: 01 00"><button onclick="sendCustom()" style="background:#673ab7">送出自訂</button></div>
<div class="small">好多 JX 機唔使寫命令，一㩒就自動推數。如果㩒咗都冇數，先逐個試上面啲命令。</div>
</div>

<div class="card">
<div><b>記錄</b></div>
<div id="history" style="font-size:14px">未有記錄</div>
<button id="clearHist" style="background:#999">清記錄</button>
</div>

<div class="card">
<pre id="raw" style="background:#eee;padding:8px;white-space:pre-wrap;word-break:break-all;font-size:12px">RAW: 等待連接...</pre>
<div class="small">用法: 1.開 JX-180 2.按連接，揀 KC4101 3.㩒清零/開始，等 Mon 變 0.0 4.用力㩒，睇 Raw 會跳咩</div>
</div>

<script>
const $=id=>document.getElementById(id);
$('time').innerText=new Date().toLocaleString();
let device=null, server=null, writeChar=null, notifyChar=null;
let maxW=0,count=0,lastW=0,history=[],lastPeak=0;

$('discBtn').onclick=async()=>{ try{if(device&&device.gatt.connected) device.gatt.disconnect();}catch(e){} device=null; maxW=0;count=0;lastW=0;history=[]; $('w').innerText='--'; $('maxW').innerText='--'; $('count').innerText='0'; $('history').innerText='未有記錄'; $('status').innerText='🧹 已斷開'; $('raw').innerText='已斷開'; };
$('clearHist').onclick=()=>{history=[];count=0;maxW=0;$('history').innerText='未有記錄';$('count').innerText='0';$('maxW').innerText='--';};

$('connBtn').onclick=async()=>{
 try{
  $('status').innerText='🔍 搵緊 KC4101...記得 JX-180 已經開機';
  device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'KC4101'},{namePrefix:'KC'}],optionalServices:[0xFFE0,0x1800]});
  $('status').innerText='連接緊 '+device.name+'...';
  device.addEventListener('gattserverdisconnected',()=>{$('status').innerText='❌ 已斷開';});
  server=await device.gatt.connect();
  $('raw').innerText='已連接: '+device.name+'\n';
  let service=await server.getPrimaryService(0xFFE0);
  let chars=await service.getCharacteristics();
  for(let c of chars){
   let uuid=c.uuid.toLowerCase();
   $('raw').innerText+='搵到: '+uuid+' '+(c.properties.notify?'NOTIFY ':'')+(c.properties.write?'WRITE ':'')+(c.properties.writeWithoutResponse?'WRITE_NR ':'')+'\n';
   if(uuid.includes('ffe1')) writeChar=c;
   if(uuid.includes('ffe2')){
    notifyChar=c;
    await c.startNotifications();
    c.addEventListener('characteristicvaluechanged',e=>onData(e));
    $('raw').innerText+='已訂閱 FFE2 Notify\n';
   }
  }
  $('status').innerHTML='✅ 已連接 '+device.name+'<br>已開 FFE2 Notify，而家㩒 清零/開始，再用力㩒';
  $('status').style.color='green';
 }catch(e){ $('status').innerText='❌ 連唔到: '+e.message; $('raw').innerText='失敗: '+e.message; }
};

function sendHex(hexStr){
 if(!writeChar){ alert('未連接 / 搵唔到 FFE1'); return; }
 let clean=hexStr.replace(/[^0-9a-fA-F]/g,'');
 let bytes=new Uint8Array(clean.match(/.{1,2}/g).map(b=>parseInt(b,16)));
 writeChar.writeValueWithoutResponse(bytes).then(()=>{ $('raw').innerText='> 送出到 FFE1: '+hexStr+'\n'+$('raw').innerText.slice(0,1500); }).catch(e=>{ $('raw').innerText='送出失敗: '+e.message+'\n'+$('raw').innerText; });
}
function sendCustom(){ let v=$('customHex').value; if(v) sendHex(v); }
window.sendHex=sendHex; window.sendCustom=sendCustom;

function onData(e){
 let arr=new Uint8Array(e.target.value.buffer);
 let hex=[...arr].map(b=>b.toString(16).padStart(2,'0')).join(' ');
 let now=new Date().toLocaleTimeString();
 $('rawHex').innerText=hex;
 $('raw').innerText='FFE2 @ '+now+' len='+arr.length+'\n'+hex+'\nbytes: ['+[...arr].join(', ')+']\n---\n'+$('raw').innerText.slice(0,2000);

 // 試解碼 - JX-180 常見格式，未知邊個啱，所以全部列出嚟試
 let cand=[];
 if(arr.length>=2){
  cand.push({n:'b0b1 BE /10',v:((arr[0]<<8|arr[1])/10)});
  cand.push({n:'b0b1 LE /10',v:((arr[1]<<8|arr[0])/10)});
  cand.push({n:'b0b1 BE /100',v:((arr[0]<<8|arr[1])/100)});
  cand.push({n:'b0b1 LE /100',v:((arr[1]<<8|arr[0])/100)});
 }
 if(arr.length>=4){
  cand.push({n:'b2b3 BE /10',v:((arr[2]<<8|arr[3])/10)});
  cand.push({n:'b2b3 LE /10',v:((arr[3]<<8|arr[2])/10)});
  cand.push({n:'b1b2 BE /10',v:((arr[1]<<8|arr[2])/10)});
  cand.push({n:'b1b2 LE /10',v:((arr[2]<<8|arr[1])/10)});
 }
 if(arr.length>=6){
  cand.push({n:'b4b5 BE /10',v:((arr[4]<<8|arr[5])/10)});
  cand.push({n:'b4b5 LE /10',v:((arr[5]<<8|arr[4])/10)});
 }
 let best=cand.find(c=>c.v>0 && c.v<180);
 // 如果全部都唔啱，顯示所有候選俾你對
 if(best){
  let w=best.v;
  $('w').innerText=w.toFixed(1);
  if(w>maxW) maxW=w;
  $('maxW').innerText=maxW.toFixed(1);
  $('status').innerHTML='✅ FFE2: '+w.toFixed(1)+'kg ('+best.n+')<br>Raw: '+hex;
  if(w>lastPeak) lastPeak=w;
  // 放開咗，記一次
  if(w<1 && lastPeak>5){ count++; history.push(lastPeak.toFixed(1)+'kg @ '+now); $('count').innerText=count; $('history').innerHTML=history.slice(-10).reverse().join('<br>'); lastPeak=0; }
  lastW=w;
 }else{
  $('status').innerHTML='⚠️ 收到 Raw 但未解到: '+hex+'<br>候選: '+cand.map(c=>c.n+'='+c.v.toFixed(1)).join(' | ');
 }
}
</script>
</body>
</html>
