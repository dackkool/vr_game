<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Street Fighter: Motion Edition (HK Stage - 3 Characters)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe Pose & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@700;900&display=swap');
        
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .font-arcade {
            font-family: 'Press Start 2P', monospace;
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.2);
        }

        canvas#gameCanvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a0a16;
            display: block;
        }

        .neon-text-red {
            text-shadow: 0 0 5px #ff0055, 0 0 10px #ff0055, 0 0 20px #ff0055;
        }
        .neon-text-yellow {
            text-shadow: 0 0 5px #ffcc00, 0 0 10px #ffcc00, 0 0 20px #ffcc00;
        }
        .neon-text-cyan {
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        #webcamVideo {
            display: none;
            transform: scaleX(-1);
        }

        .shake {
            animation: shakeAnim 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shakeAnim {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0); }
            40%, 60% { transform: translate3d(6px, -2px, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 text-white overflow-hidden">

    <div id="gameWrapper" class="relative overflow-hidden border border-slate-800">
        <div class="scanlines"></div>
        <video id="webcamVideo" playsinline></video>
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div class="absolute top-3 left-3 right-3 z-20 flex justify-between items-center pointer-events-auto">
            <div class="flex items-center space-x-2 bg-slate-900/90 border border-yellow-500/40 px-3 py-1.5 rounded shadow-lg backdrop-blur-md">
                <span class="font-arcade text-xs text-yellow-400 tracking-wider">STREET FIGHTER: HK STAGE</span>
                <span class="text-[10px] bg-red-600 text-white px-1.5 py-0.5 rounded font-mono font-bold" id="p1TitleBadge">RYU</span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btnToggleCam" onclick="toggleCamera()" class="bg-slate-800/90 hover:bg-slate-700 text-emerald-400 text-xs px-3 py-1.5 rounded border border-emerald-500/30 flex items-center space-x-1.5 transition-all shadow">
                    <i class="fa-solid fa-camera"></i>
                    <span id="camBtnText" class="font-arcade text-[10px]">📷 CAM</span>
                </button>
                <button id="btnToggleInput" onclick="toggleInputMode()" class="bg-indigo-900/90 hover:bg-indigo-800 text-indigo-200 text-xs px-3 py-1.5 rounded border border-indigo-400/30 flex items-center space-x-1.5 transition-all shadow">
                    <i class="fa-solid fa-gamepad"></i>
                    <span id="inputBtnText" class="font-arcade text-[10px]">MOTION</span>
                </button>
                <button onclick="toggleFullScreen()" class="bg-purple-900/90 hover:bg-purple-800 text-purple-200 text-xs px-3 py-1.5 rounded border border-purple-400/30 flex items-center space-x-1.5 transition-all shadow">
                    <i class="fa-solid fa-expand"></i>
                    <span class="font-arcade text-[10px]">FULL</span>

                <button onclick="openHelpModal()" class="bg-amber-600/90 hover:bg-amber-500 text-white text-xs px-2.5 py-1.5 rounded border border-amber-400/30 transition-all shadow">
                    <i class="fa-solid fa-gear"></i>

        <div id="pipContainer" class="absolute bottom-3 right-3 z-20 w-36 h-28 bg-slate-900/85 border-2 border-emerald-500/50 rounded overflow-hidden hidden shadow-2xl backdrop-blur-sm">
            <canvas id="pipCanvas" class="w-full h-full object-cover transform -scale-x-100"></canvas>
            <div class="absolute bottom-0 left-0 right-0 bg-black/80 text-[8px] text-emerald-400 text-center py-0.5 font-mono">
                AI POSE TRACKER

        <div id="gestureBadges" class="absolute bottom-3 left-3 z-20 flex flex-wrap gap-1.5 max-w-xs pointer-events-none">
            <span id="badgeGuard" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800/80 text-slate-500 border border-slate-700">GUARD / 防禦</span>
            <span id="badgePunch" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800/80 text-slate-500 border border-slate-700">PUNCH / 出拳</span>
            <span id="badgeKick" class="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800/80 text-slate-500 border border-slate-700">KICK / 出腳</span>

        <!-- Main Opening Menu Overlay with Character Selector -->

    <!-- Game Engine & AI Motion Script -->
    <script>
        // --- WEBAUDIO SYNTHESIZER ---
        class SoundFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') { this.ctx.resume(); }
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.15);
            }
            playHadouken() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.35);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.35);
            }
            playShoryuken() {
                if (!this.ctx) return;
                for (let i = 0; i < 3; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200 + i * 150, this.ctx.currentTime + i * 0.08);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + i * 0.08 + 0.2);
                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i * 0.08 + 0.2);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(this.ctx.currentTime + i * 0.08);
                    osc.stop(this.ctx.currentTime + i * 0.08 + 0.2);
                }
            }
            playKO() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 1.0);
                gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.0);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 1.0);
            }
        }

        const sfx = new SoundFX();

        // --- CONSTANTS ---
        const CANVAS_WIDTH = 960;
        const CANVAS_HEIGHT = 540;
        const GROUND_Y = 430;

        const STATE_MENU = 'MENU';
        const STATE_ROUND_INTRO = 'ROUND_INTRO';
        const STATE_PLAYING = 'PLAYING';
        const STATE_ROUND_OVER = 'ROUND_OVER';
        const STATE_GAMEOVER = 'GAMEOVER';

        let gameState = STATE_MENU;
        let gameMode = '1P';
        let inputMode = 'MOTION';
        let selectedChar = 'ryu'; // 當前選擇的主角

        function selectCharacter(charKey) {
            selectedChar = charKey;
            ['ryu', 'ken', 'guile', 'ehonda'].forEach(k => {
                const btn = document.getElementById(k === 'ryu' ? 'btnCharRyu' : (k === 'ken' ? 'btnCharKen' : (k === 'guile' ? 'btnCharGuile' : 'btnCharHonda')));
                if (btn) {
                    if (k === charKey) {
                        btn.className = "px-4 py-2 bg-amber-500 text-black font-arcade text-xs rounded border border-white shadow";
                    } else {
                        btn.className = "px-4 py-2 bg-slate-800 text-white font-arcade text-xs rounded border border-slate-600 shadow";
                    }
                }
            });
            player1.name = charKey.toUpperCase();
            document.getElementById('p1TitleBadge').textContent = player1.name;
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const pipCanvas = document.getElementById('pipCanvas');
        const pipCtx = pipCanvas.getContext('2d');

        const keys = {};

        let currentRound = 1;
        let p1RoundWins = 0;
        let p2RoundWins = 0;
        let roundTimer = 99;
        let timerInterval = null;
        let hadoukenChargeTime = 0;

        function triggerScreenShake() {
            const wrapper = document.getElementById('gameWrapper');
            wrapper.classList.remove('shake');
            void wrapper.offsetWidth;
            wrapper.classList.add('shake');
        }

        // --- FIGHTER CLASS ---
        class Fighter {
            constructor(x, color, name, isCPU = false) {
                this.startX = x;
                this.x = x;
                this.y = GROUND_Y;
                this.vx = 0;
                this.vy = 0;
                this.width = 60;
                this.height = 115;
                this.color = color;
                this.name = name;
                this.isCPU = isCPU;

                this.hp = 100;
                this.maxHp = 100;

                this.isGrounded = true;
                this.isCrouching = false;
                this.isGuarding = false;
                this.facingRight = (x < CANVAS_WIDTH / 2);

                this.action = 'IDLE';
                this.actionTimer = 0;
                this.hitStun = 0;
                this.animFrame = 0;

                this.attackBox = { x: 0, y: 0, width: 0, height: 0, active: false };
                this.isKnockedDown = false;
                this.fallAngle = 0;
            }

            reset(x) {
                this.x = x;
                this.y = GROUND_Y;
                this.vx = 0;
                this.vy = 0;
                this.hp = 100;
                this.isGrounded = true;
                this.isCrouching = false;
                this.isGuarding = false;
                this.action = 'IDLE';
                this.actionTimer = 0;
                this.hitStun = 0;
                this.isKnockedDown = false;
                this.fallAngle = 0;
            }

            triggerKnockdown() {
                this.isKnockedDown = true;
                this.action = 'HIT';
                this.attackBox.active = false;
                this.vy = -9;
                this.isGrounded = false;
            }

            update(enemy) {
                this.animFrame++;

                if (this.isKnockedDown) {
                    if (Math.abs(this.fallAngle) < Math.PI / 2) {
                        this.fallAngle += (this.facingRight ? -0.15 : 0.15);
                    }
                    if (!this.isGrounded) {
                        this.vy += 0.85;
                        this.y += this.vy;
                        if (this.y >= GROUND_Y) {
                            this.y = GROUND_Y;
                            this.vy = 0;
                            this.isGrounded = true;
                        }
                    }
                    return;
                }

                if (this.action === 'IDLE' || this.action === 'JUMP') {
                    this.facingRight = (this.x < enemy.x);
                }

                if (this.hitStun > 0) {
                    this.hitStun--;
                    if (this.hitStun === 0) this.action = 'IDLE';
                }

                if (!this.isGrounded) {
                    this.vy += 0.85;
                    this.y += this.vy;

                    if (this.y >= GROUND_Y) {
                        this.y = GROUND_Y;
                        this.vy = 0;
                        this.isGrounded = true;
                        if (this.action === 'JUMP' || this.action === 'SHORYUKEN') this.action = 'IDLE';
                    }
                }

                this.x += this.vx;

                if (this.x < 50) this.x = 50;
                if (this.x > CANVAS_WIDTH - 50) this.x = CANVAS_WIDTH - 50;

                const dist = Math.abs(this.x - enemy.x);
                if (dist < 60 && !this.isKnockedDown && !enemy.isKnockedDown) {
                    const overlap = 60 - dist;
                    if (this.x < enemy.x) {
                        this.x -= overlap / 2;
                        enemy.x += overlap / 2;
                    } else {
                        this.x += overlap / 2;
                        enemy.x -= overlap / 2;
                    }
                }

                if (this.actionTimer > 0) {
                    this.actionTimer--;
                    if (this.actionTimer === 0 && this.hitStun === 0) {
                        this.action = 'IDLE';
                        this.attackBox.active = false;
                    }
                }

                this.updateHitbox();

                if (this.isCPU && gameState === STATE_PLAYING) {
                    this.updateCPU(enemy);
                }
            }

            updateHitbox() {
                if (!this.attackBox.active || this.isKnockedDown) return;

                let attackRange = 75;
                if (this.action === 'SHORYUKEN') attackRange = 90;

                this.attackBox.x = this.facingRight ? this.x + 20 : this.x - 20 - attackRange;
                this.attackBox.y = this.action === 'SHORYUKEN' ? this.y - 120 : this.y - 80;
                this.attackBox.width = attackRange;
                this.attackBox.height = 60;
            }

            punch() {
                if (this.isKnockedDown || this.actionTimer > 0 || this.hitStun > 0) return;
                this.action = 'PUNCH';
                this.actionTimer = 16;
                this.attackBox.active = true;
                sfx.playHit();
            }

            kick() {
                if (this.isKnockedDown || this.actionTimer > 0 || this.hitStun > 0) return;
                this.action = 'KICK';
                this.actionTimer = 20;
                this.attackBox.active = true;
                sfx.playHit();
            }

            hadouken() {
                if (this.isKnockedDown || this.actionTimer > 0 || this.hitStun > 0) return;
                this.action = 'HADOUKEN';
                this.actionTimer = 26;
                sfx.playHadouken();

                const spawnX = this.facingRight ? this.x + 50 : this.x - 50;
                const char = (!this.isCPU) ? selectedChar : 'ken';
                fireballs.push(new Fireball(spawnX, this.y - 65, this.facingRight, this, char));
            }

            shoryuken() {
                if (this.isKnockedDown || this.actionTimer > 0 || this.hitStun > 0) return;
                this.action = 'SHORYUKEN';
                this.actionTimer = 32;
                this.vy = -15;
                this.isGrounded = false;
                this.attackBox.active = true;
                sfx.playShoryuken();
                triggerScreenShake();

                for (let i = 0; i < 20; i++) {
                    spawnSparks(this.x, this.y - 60, '#ffcc00');
                }
            }

            jump() {
                if (!this.isKnockedDown && this.isGrounded && this.hitStun === 0) {
                    this.vy = -14;
                    this.isGrounded = false;
                    this.action = 'JUMP';
                }
            }

            takeDamage(amount, isBlockable = true) {
                if (this.isKnockedDown) return;

                if (this.isGuarding && isBlockable) {
                    this.action = 'BLOCKED';
                    this.actionTimer = 12;
                    this.hp -= amount * 0.05;
                    spawnSparks(this.x, this.y - 60, '#00f0ff');
                    return;
                }

                this.hp -= amount;
                if (this.hp <= 0) {
                    this.hp = 0;
                    this.triggerKnockdown();
                } else {
                    this.hitStun = 22;
                    this.action = 'HIT';
                }

                spawnSparks(this.x, this.y - 60, '#ff0055');
                sfx.playHit();
            }

            updateCPU(enemy) {
                if (this.isKnockedDown || this.hitStun > 0) return;

                const dx = enemy.x - this.x;
                const absDx = Math.abs(dx);

                if (absDx > 170) {
                    this.vx = dx > 0 ? 2.8 : -2.8;
                } else if (absDx < 70) {
                    this.vx = 0;
                    if (Math.random() < 0.05) this.punch();
                    else if (Math.random() < 0.04) this.kick();
                    else if (Math.random() < 0.03) this.shoryuken();
                } else {
                    this.vx = 0;
                    if (Math.random() < 0.02) this.hadouken();
                    else if (Math.random() < 0.015) this.jump();
                }
            }

            draw(ctx) {
                ctx.save();

                if (this.isKnockedDown) {
                    ctx.translate(this.x, this.y - this.height / 2);
                    ctx.rotate(this.fallAngle);
                    ctx.translate(-this.x, -(this.y - this.height / 2));
                }

                const breathY = this.isKnockedDown ? 0 : Math.sin(this.animFrame * 0.1) * 2;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(this.x, GROUND_Y + 4, 38, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                let currentHeight = this.height;
                let drawY = this.y - currentHeight + breathY;

                if (this.isCrouching && !this.isKnockedDown) {
                    currentHeight = this.height * 0.65;
                    drawY = this.y - currentHeight;
                }

                const charType = (!this.isCPU) ? selectedChar : 'ken';

                // 角色體型與道袍顏色繪製
                if (charType === 'ehonda') {
                    // 本田：肥大體型
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(this.x - 34, drawY + 30, 68, currentHeight - 30);
                } else if (charType === 'guile') {
                    // 古烈：軍裝
                    ctx.fillStyle = '#1e3a8a';
                    ctx.fillRect(this.x - 24, drawY + 32, 48, currentHeight - 32);
                } else if (charType === 'ken') {
                    // 肯：紅道袍
                    ctx.fillStyle = '#dc2626';
                    ctx.fillRect(this.x - 24, drawY + 32, 48, currentHeight - 32);
                } else {
                    // 隆：白道袍
                    ctx.fillStyle = '#f8fafc';
                    ctx.fillRect(this.x - 24, drawY + 32, 48, currentHeight - 32);
                }

                // 腰帶
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(this.x - 25, drawY + currentHeight - 45, 50, 8);

                // 頭部皮膚
                ctx.fillStyle = '#fbe3b5';
                ctx.fillRect(this.x - 16, drawY, 32, 30);

                ctx.fillStyle = '#0f172a';
                const eyeOffsetX = this.facingRight ? 4 : -10;
                ctx.fillRect(this.x + eyeOffsetX, drawY + 12, 6, 4);

                // 根據角色顯示獨特髮型特徵
                if (charType === 'guile') {
                    // 古烈：倒三角金色掃把頭
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.moveTo(this.x - 20, drawY);
                    ctx.lineTo(this.x + 20, drawY);
                    ctx.lineTo(this.x + 26, drawY - 14);
                    ctx.lineTo(this.x, drawY - 20);
                    ctx.lineTo(this.x - 26, drawY - 14);
                    ctx.closePath();
                    ctx.fill();
                } else if (charType === 'ehonda') {
                    // 本田：相撲髮髻
                    ctx.fillStyle = '#18181b';
                    ctx.fillRect(this.x - 18, drawY - 6, 36, 12);
                    ctx.fillRect(this.x - 6, drawY - 16, 12, 12);
                } else if (charType === 'ken') {
                    // 肯：金髮
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(this.x - 18, drawY - 8, 36, 16);
                } else {
                    // 隆：黑髮 + 紅頭帶
                    ctx.fillStyle = '#1e1b18';
                    ctx.fillRect(this.x - 18, drawY - 4, 36, 12);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(this.x - 18, drawY + 6, 36, 6);
                }

                // 動作繪製
                if (this.action === 'PUNCH' && !this.isKnockedDown) {
                    ctx.fillStyle = '#fbe3b5';
                    const punchX = this.facingRight ? this.x + 22 : this.x - 62;
                    ctx.fillRect(punchX, drawY + 20, 40, 16);
                } else if (this.action === 'KICK' && !this.isKnockedDown) {
                    ctx.fillStyle = '#f8fafc';
                    const kickX = this.facingRight ? this.x + 22 : this.x - 65;
                    ctx.fillRect(kickX, drawY + 45, 45, 18);
                } else if (this.action === 'HADOUKEN' && !this.isKnockedDown) {
                    ctx.fillStyle = '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(this.x + (this.facingRight ? 35 : -35), drawY + 35, 22, 0, Math.PI * 2);
                    ctx.fill();
                } else if ((this.isGuarding || this.action === 'BLOCKED') && !this.isKnockedDown) {
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(this.x - 28, drawY - 6, 56, currentHeight + 12);
                }

                ctx.restore();
            }
        }

        // --- FIREBALL PROJECTILE CLASS (支援古烈旋轉回力標 & 本田衝撞特效) ---
        class Fireball {
            constructor(x, y, facingRight, owner, charType) {
                this.x = x;
                this.y = y;
                this.vx = facingRight ? 10 : -10;
                this.facingRight = facingRight;
                this.owner = owner;
                this.radius = 24;
                this.active = true;
                this.charType = charType;
                this.rotAngle = 0;
            }

            update() {
                this.x += this.vx;
                this.rotAngle += 0.3;

                if (this.x < -60 || this.x > CANVAS_WIDTH + 60) {
                    this.active = false;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (this.charType === 'guile') {
                    // 古烈：旋轉回力標音速手刀
                    ctx.rotate(this.rotAngle);
                    ctx.fillStyle = '#00f0ff';
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-25, -10);
                    ctx.lineTo(25, -10);
                    ctx.lineTo(35, 0);
                    ctx.lineTo(25, 10);
                    ctx.lineTo(-25, 10);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (this.charType === 'ehonda') {
                    // 本田：相撲向前衝撞波
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-25, -20, 50, 40);
                } else {
                    // 隆/肯：標準波動拳
                    const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, this.radius * 1.6);
                    grad.addColorStop(0, '#ffffff');
                    grad.addColorStop(0.3, this.charType === 'ken' ? '#ef4444' : '#38bdf8');
                    grad.addColorStop(0.7, this.charType === 'ken' ? '#b91c1c' : '#1d4ed8');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');

                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 1.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        let particles = [];
        function spawnSparks(x, y, color) {
            for (let i = 0; i < 14; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    size: Math.random() * 6 + 2,
                    color: color,
                    life: 18
                });
            }
        }

        function updateParticles() {
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);
        }

        function drawParticles(ctx) {
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        const player1 = new Fighter(240, '#f8fafc', 'RYU');
        const player2 = new Fighter(720, '#dc2626', 'KEN', true);
        let fireballs = [];

        // --- MEDIAPIPE MOTION ENGINE ---
        let pose = null;
        let camera = null;
        let isCamActive = false;

        function initMediaPipe() {
            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            const videoElement = document.getElementById('webcamVideo');
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    if (isCamActive) {
                        await pose.send({ image: videoElement });
                    }
                },
                width: 640,
                height: 480
            });
        }

        function toggleCamera() {
            sfx.init();
            const btnText = document.getElementById('camBtnText');
            const pip = document.getElementById('pipContainer');

            if (!isCamActive) {
                if (!camera) initMediaPipe();
                camera.start();
                isCamActive = true;
                btnText.textContent = "📷 ON";
                pip.classList.remove('hidden');
            } else {
                if (camera) camera.stop();
                isCamActive = false;
                btnText.textContent = "📷 CAM";
                pip.classList.add('hidden');
            }
        }

        function toggleInputMode() {
            sfx.init();
            inputMode = inputMode === 'MOTION' ? 'KEYBOARD' : 'MOTION';
            document.getElementById('inputBtnText').textContent = inputMode;
        }

        function onPoseResults(results) {
            pipCtx.save();
            pipCtx.clearRect(0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.drawImage(results.image, 0, 0, pipCanvas.width, pipCanvas.height);
            pipCtx.restore();

            if (!results.poseLandmarks || gameState !== STATE_PLAYING || inputMode !== 'MOTION') return;

            const lm = results.poseLandmarks;
            const nose = lm[0];
            const leftWrist = lm[15];
            const rightWrist = lm[16];
            const leftShoulder = lm[11];
            const rightShoulder = lm[12];
            const leftHip = lm[23];
            const rightHip = lm[24];
            const leftAnkle = lm[27];
            const rightAnkle = lm[28];

            const hipCenterX = 1.0 - (leftHip.x + rightHip.x) / 2;
            const targetX = hipCenterX * CANVAS_WIDTH;
            player1.x += (targetX - player1.x) * 0.22;

            resetBadges();

            if (leftWrist.y < nose.y + 0.12 && rightWrist.y < nose.y + 0.12) {
                player1.isGuarding = true;
                highlightBadge('badgeGuard');
            } else {
                player1.isGuarding = false;
            }

            const handDist = Math.hypot(leftWrist.x - rightWrist.x, leftWrist.y - rightWrist.y);
            const handsNearWaist = (leftWrist.y > leftShoulder.y && rightWrist.y > rightShoulder.y);

            if (handDist < 0.18 && handsNearWaist) {
                hadoukenChargeTime++;
                highlightBadge('badgeCharge');
                spawnSparks(player1.x + (player1.facingRight ? 20 : -20), player1.y - 60, '#00f0ff');

                if (hadoukenChargeTime > 12) {
                    player1.hadouken();
                    highlightBadge('badgeHadouken');
                    hadoukenChargeTime = 0;
                }
            } else {
                hadoukenChargeTime = Math.max(0, hadoukenChargeTime - 1);
            }

            if ((leftWrist.y < nose.y - 0.18 && rightWrist.y > rightShoulder.y) || 
                (rightWrist.y < nose.y - 0.18 && leftWrist.y > leftShoulder.y)) {
                player1.shoryuken();
                highlightBadge('badgeShoryuken');
            }

            if ((leftWrist.y < leftShoulder.y && handDist > 0.35) || (rightWrist.y < rightShoulder.y && handDist > 0.35)) {
                if (player1.action === 'IDLE') {
                    player1.punch();
                    highlightBadge('badgePunch');
                }
            }

            if (leftAnkle.y < leftHip.y + 0.2 || rightAnkle.y < rightHip.y + 0.2) {
                if (player1.action === 'IDLE') {
                    player1.kick();
                    highlightBadge('badgeKick');
                }
            }

            const hipCenterY = (leftHip.y + rightHip.y) / 2;
            if (hipCenterY < 0.40) {
                player1.jump();
            } else if (hipCenterY > 0.68) {
                player1.isCrouching = true;
            } else {
                player1.isCrouching = false;
            }
        }

        function resetBadges() {
            const ids = ['badgeGuard', 'badgePunch', 'badgeKick', 'badgeCharge', 'badgeHadouken', 'badgeShoryuken'];
            ids.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-slate-800/80 text-slate-500 border border-slate-700";
            });
        }

        function highlightBadge(id) {
            const el = document.getElementById(id);
            if (el) el.className = "px-2 py-0.5 rounded text-[10px] font-bold bg-amber-500 text-slate-950 border border-amber-300 shadow-lg animate-pulse";
        }

        window.addEventListener('keydown', (e) => {
            sfx.init();
            keys[e.key.toLowerCase()] = true;

            if (gameState === STATE_PLAYING && inputMode === 'KEYBOARD') {
                if (e.key.toLowerCase() === 'a') player1.vx = -4;
                if (e.key.toLowerCase() === 'd') player1.vx = 4;
                if (e.key.toLowerCase() === 'w') player1.jump();
                if (e.key.toLowerCase() === 's') player1.isCrouching = true;

                if (e.key.toLowerCase() === 'j') player1.punch();
                if (e.key.toLowerCase() === 'k') player1.kick();
                if (e.key.toLowerCase() === 'u') player1.hadouken();
                if (e.key.toLowerCase() === 'i') player1.shoryuken();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (inputMode === 'KEYBOARD') {
                if (e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') player1.vx = 0;
                if (e.key.toLowerCase() === 's') player1.isCrouching = false;
            }
        });

        function drawHongKongStage(ctx) {
            const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            skyGrad.addColorStop(0, '#020208');
            skyGrad.addColorStop(0.6, '#0d0918');
            skyGrad.addColorStop(1, '#1d0c2b');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 35; i++) {
                const sx = (i * 37) % CANVAS_WIDTH;
                const sy = (i * 19) % 220;
                ctx.fillRect(sx, sy, (i % 2 === 0) ? 2 : 1, (i % 2 === 0) ? 2 : 1);
            }

            ctx.fillStyle = '#0a0714';
            ctx.beginPath();
            ctx.moveTo(0, 320);
            ctx.lineTo(220, 250);
            ctx.lineTo(480, 290);
            ctx.lineTo(720, 220);
            ctx.lineTo(CANVAS_WIDTH, 300);
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.lineTo(0, CANVAS_HEIGHT);
            ctx.fill();

            ctx.fillStyle = '#110d24';
            ctx.fillRect(190, 170, 50, 200);
            ctx.beginPath();
            ctx.moveTo(190, 170);
            ctx.lineTo(215, 110);
            ctx.lineTo(240, 170);
            ctx.fill();

            ctx.fillRect(90, 210, 65, 200);
            ctx.fillRect(340, 190, 80, 200);
            ctx.fillRect(640, 180, 85, 200);

            drawNeonSign(ctx, 130, 110, '彌敦道', '#ff0055');
            drawNeonSign(ctx, 430, 100, '大排檔', '#00ff66');
            drawNeonSign(ctx, 730, 120, '武館 功夫', '#ffcc00');

            ctx.fillStyle = '#12121a';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);

            ctx.fillStyle = '#eab308';
            ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, 6);
        }

        function drawNeonSign(ctx, x, y, text, color) {
            ctx.save();
            ctx.font = '900 20px "Noto Sans TC", sans-serif';
            ctx.shadowColor = color;
            ctx.shadowBlur = 14;
            ctx.fillStyle = color;

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.strokeRect(x - 10, y - 22, text.length * 24 + 15, 32);

            ctx.fillText(text, x, y);
            ctx.restore();
        }

        function drawHUD(ctx) {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(40, 25, 360, 24);
            const p1Width = (player1.hp / player1.maxHp) * 356;
            ctx.fillStyle = player1.hp > 30 ? '#eab308' : '#ef4444';
            ctx.fillRect(42, 27, p1Width, 20);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(CANVAS_WIDTH - 400, 25, 360, 24);
            const p2Width = (player2.hp / player2.maxHp) * 356;
            ctx.fillStyle = player2.hp > 30 ? '#eab308' : '#ef4444';
            ctx.fillRect(CANVAS_WIDTH - 40 - p2Width, 27, p2Width, 20);

            ctx.font = '700 12px "Press Start 2P"';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(player1.name, 40, 18);
            ctx.fillText(player2.name, CANVAS_WIDTH - 100, 18);

            for (let i = 0; i < 2; i++) {
                ctx.fillStyle = i < p1RoundWins ? '#eab308' : '#334155';
                ctx.beginPath();
                ctx.arc(40 + i * 22, 58, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = i < p2RoundWins ? '#eab308' : '#334155';
                ctx.beginPath();
                ctx.arc(CANVAS_WIDTH - 40 - i * 22, 58, 8, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(CANVAS_WIDTH / 2 - 30, 15, 60, 42);
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 2;
            ctx.strokeRect(CANVAS_WIDTH / 2 - 30, 15, 60, 42);

            ctx.font = '900 22px "Press Start 2P"';
            ctx.fillStyle = roundTimer < 10 ? '#ef4444' : '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(roundTimer.toString(), CANVAS_WIDTH / 2, 45);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            drawHongKongStage(ctx);

            if (gameState === STATE_PLAYING || gameState === STATE_ROUND_OVER) {
                player1.update(player2);
                player2.update(player1);

                fireballs.forEach(fb => fb.update());
                fireballs = fireballs.filter(fb => fb.active);

                if (gameState === STATE_PLAYING) {
                    fireballs.forEach(fb => {
                        if (!fb.active) return;
                        const target = fb.owner === player1 ? player2 : player1;
                        const dist = Math.hypot(fb.x - target.x, fb.y - (target.y - 50));

                        if (dist < fb.radius + 32) {
                            target.takeDamage(16);
                            fb.active = false;
                        }
                    });

                    checkMeleeHit(player1, player2);
                    checkMeleeHit(player2, player1);
                }

                updateParticles();

                player1.draw(ctx);
                player2.draw(ctx);
                fireballs.forEach(fb => fb.draw(ctx));
                drawParticles(ctx);

                drawHUD(ctx);

                if (gameState === STATE_PLAYING && (player1.hp <= 0 || player2.hp <= 0)) {
                    handleRoundEnd(player1.hp > 0 ? player1 : player2);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function checkMeleeHit(attacker, defender) {
            if (!attacker.attackBox.active) return;

            const box = attacker.attackBox;
            const defBox = {
                x: defender.x - 25,
                y: defender.y - defender.height,
                width: 50,
                height: defender.height
            };

            if (box.x < defBox.x + defBox.width &&
                box.x + box.width > defBox.x &&
                box.y < defBox.y + defBox.height &&
                box.y + box.height > defBox.y) {
                
                let damage = attacker.action === 'SHORYUKEN' ? 24 : (attacker.action === 'KICK' ? 14 : 10);
                defender.takeDamage(damage);
                attacker.attackBox.active = false;
            }
        }

        function startGame(mode) {
            sfx.init();
            gameMode = mode;
            p1RoundWins = 0;
            p2RoundWins = 0;
            currentRound = 1;

            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');

            startNextRound();
        }

        function startNextRound() {
            player1.reset(240);
            player2.reset(720);
            fireballs = [];

            roundTimer = 99;
            gameState = STATE_ROUND_INTRO;

            const overlay = document.getElementById('roundOverlay');
            const roundText = document.getElementById('roundText');
            overlay.classList.remove('hidden');
            roundText.textContent = `ROUND ${currentRound}`;

            setTimeout(() => {
                roundText.textContent = "FIGHT!";
                sfx.playHit();
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    gameState = STATE_PLAYING;

                    clearInterval(timerInterval);
                    timerInterval = setInterval(() => {
                        if (gameState === STATE_PLAYING) {
                            roundTimer--;
                            if (roundTimer <= 0) {
                                roundTimer = 0;
                                const winner = player1.hp >= player2.hp ? player1 : player2;
                                const loser = player1.hp >= player2.hp ? player2 : player1;
                                loser.triggerKnockdown();
                                handleRoundEnd(winner);
                            }
                        }
                    }, 1000);
                }, 800);
            }, 1200);
        }

        function handleRoundEnd(winner) {
            gameState = STATE_ROUND_OVER;
            clearInterval(timerInterval);
            sfx.playKO();

            if (winner === player1) {
                p1RoundWins++;
                player2.triggerKnockdown();
            } else {
                p2RoundWins++;
                player1.triggerKnockdown();
            }

            const overlay = document.getElementById('roundOverlay');
            const roundText = document.getElementById('roundText');
            overlay.classList.remove('hidden');
            roundText.textContent = "K.O.";

            setTimeout(() => {
                if (p1RoundWins >= 2 || p2RoundWins >= 2) {
                    endMatch(p1RoundWins >= 2 ? "YOU WIN THE MATCH!" : "CPU WINS MATCH!");
                } else {
                    currentRound++;
                    startNextRound();
                }
            }, 2500);
        }

        function endMatch(winnerTextStr) {
            gameState = STATE_GAMEOVER;
            document.getElementById('roundOverlay').classList.add('hidden');
            document.getElementById('winnerText').textContent = winnerTextStr;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function restartMatch() {
            document.getElementById('menuOverlay').classList.remove('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
        }

        function openHelpModal() {
            sfx.init();
            document.getElementById('helpModal').classList.remove('hidden');
        }

        function closeHelpModal() {
            document.getElementById('helpModal').classList.add('hidden');
        }

        function toggleFullScreen() {
            const elem = document.getElementById('gameWrapper');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        window.onload = () => {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
