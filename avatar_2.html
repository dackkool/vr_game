<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>阿凡達潘朵拉：哈利路亞懸浮山極限飛行 (VR與陀螺儀反向視角版)</title>

  <!-- Cesium 3D 引擎 -->
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body, #cesiumContainer { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }

    /* HUD 介面 */
    #hud {
      position: fixed; top: 15px; left: 15px; z-index: 999;
      background: rgba(4, 16, 38, 0.88); color: #00e5ff; padding: 16px;
      border-radius: 14px; font-size: 13px; line-height: 1.6;
      backdrop-filter: blur(12px); border: 1px solid rgba(0,229,255,0.4);
      box-shadow: 0 0 20px rgba(0,229,255,0.25); min-width: 230px;
    }

    .stamina-container { width: 100%; background: #112233; height: 10px; border-radius: 5px; margin-top: 6px; overflow: hidden; border: 1px solid #00e5ff; }
    #staminaBar { width: 100%; height: 100%; background: linear-gradient(90deg, #00ff88, #00e5ff); transition: width 0.1s linear; }

    /* WebCam 視訊 */
    #webcamContainer {
      position: fixed; top: 15px; right: 15px; z-index: 999;
      width: 160px; height: 120px; border-radius: 12px; overflow: hidden;
      border: 2px solid #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.3); background: #000;
    }
    #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* VR 按鈕與控制列 */
    .vr-btn {
      margin-top: 10px; background: rgba(0,229,255,0.2); border: 1px solid #00e5ff;
      color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer;
      font-size: 12px; transition: all 0.2s ease; width: 100%; text-align: center;
    }
    .vr-btn:hover { background: rgba(0,229,255,0.5); }

    /* 遮罩 UI */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 16, 0.94); z-index: 2000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 20px; backdrop-filter: blur(15px);
    }

    .overlay h1 { font-size: 32px; margin-bottom: 15px; color: #00e5ff; text-shadow: 0 0 20px rgba(0,229,255,0.9); }
    .overlay p { font-size: 15px; line-height: 1.8; margin-bottom: 12px; max-width: 550px; color: #bceeff; }
    .overlay ul { text-align: left; margin: 15px 0 25px 0; font-size: 14px; line-height: 2; color: #e0f7ff; }

    .btn {
      background: linear-gradient(135deg, #00ffff, #8a2be2);
      color: #fff; border: none; padding: 16px 48px; font-size: 20px; font-weight: bold;
      border-radius: 40px; cursor: pointer; transition: all 0.25s ease;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.7); text-transform: uppercase;
    }
    .btn:hover { transform: scale(1.05); }

    #statusBanner {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 229, 255, 0.2); border: 2px solid #00e5ff;
      color: #fff; padding: 12px 28px; border-radius: 30px; font-size: 16px;
      font-weight: bold; text-shadow: 0 0 10px #00e5ff; backdrop-filter: blur(10px);
      z-index: 999; text-align: center; box-shadow: 0 0 25px rgba(0,229,255,0.4);
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>

  <!-- 開始介面 -->
  <div id="startOverlay" class="overlay">
    <h1>🌌 潘朵拉哈利路亞懸浮山體驗 (VR/陀螺儀增強版)</h1>
    <p>點擊開始後將進入全螢幕橫屏，並<b>啟用手機陀螺儀與VR模式</b>：</p>
    <ul>
      <li>🦅 <b>抓山壁自動轉向：</b> 撞擊建築或山壁爪實時，<b>視角自動反轉 180°</b>，背對山壁面向空曠風景。</li>
      <li>📱 <b>陀螺儀視角：</b> 爪實停棲時，直接轉動/抬高手機即可 360° 控制觀看角度！</li>
      <li>🥽 <b>VR 模式切換：</b> 支援 WebXR 雙眼分割畫面，給予最真實的飛行與停棲沉浸感。</li>
      <li>🚀 <b>雙手拉下起飛：</b> 停棲時雙手向下拉，即向視角正面彈射起飛！</li>
    </ul>
    <button id="startBtn" class="btn">啟動陀螺儀與全螢幕</button>
  </div>

  <div id="statusBanner" class="hidden">
    <span id="bannerText">自由飛行中</span>
  </div>

  <!-- HUD -->
  <div id="hud">
    <b>🐉 狀態：<span id="statusTxt" style="color:#00ff00;">神經連結成功</span></b><br>
    高度：<span id="altTxt">800 m</span> | 速度：<span id="spdTxt">120 km/h</span><br>
    姿態：<span id="poseTxt" style="color:#ffea00;">平穩滑翔</span><br>
    體力 (Stamina)：
    <div class="stamina-container">
      <div id="staminaBar"></div>
    </div>
    <button id="vrToggleBtn" class="vr-btn">🥽 切換 VR 分割模式</button>
  </div>

  <div id="webcamContainer">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_ACCESS_TOKEN';

    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false, timeline: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false,
      vrButton: false // 自訂控制
    });

    // 光照與環境優化
    viewer.scene.globe.enableLighting = true;
    viewer.scene.highDynamicRange = true;

    // 載入 Google 3D 實景地貌
    async function init3D() {
      try {
        const tileset = await Cesium.createGooglePhotorealistic3DTileset();
        viewer.scene.primitives.add(tileset);
      } catch (err) { console.error("3D 地貌載入錯誤:", err); }
    }
    init3D();

    // 螢光視覺修飾
    const bioluminescenceShader = `
      uniform sampler2D colorTexture;
      in vec2 v_textureCoordinates;
      out vec4 fragColor;

      void main() {
        vec4 color = texture(colorTexture, v_textureCoordinates);
        vec3 glowCyan = vec3(0.0, 0.8, 0.9) * color.g * 0.5;
        vec3 glowPurple = vec3(0.4, 0.1, 0.8) * color.b * 0.3;
        vec3 finalColor = color.rgb * 0.8 + glowCyan + glowPurple;
        fragColor = vec4(finalColor, color.a);
      }
    `;

    viewer.scene.postProcessStages.add(new Cesium.PostProcessStage({
      fragmentShader: bioluminescenceShader
    }));

    const BASE_LON = 110.4350;
    const BASE_LAT = 29.3520;

    // 生成懸浮山聚落
    const floatingIslands = [];

    function createFloatingIslandCluster() {
      const islandData = [
        { lonOffset: 0.001, latOffset: 0.001, alt: 650, radius: 100 },
        { lonOffset: -0.002, latOffset: 0.0025, alt: 850, radius: 130 },
        { lonOffset: 0.0025, latOffset: -0.002, alt: 550, radius: 110 },
        { lonOffset: -0.0015, latOffset: -0.003, alt: 950, radius: 140 }
      ];

      islandData.forEach((pos) => {
        const lon = BASE_LON + pos.lonOffset;
        const lat = BASE_LAT + pos.latOffset;
        const centerPos = Cesium.Cartesian3.fromDegrees(lon, lat, pos.alt);

        const islandEntity = viewer.entities.add({
          position: centerPos,
          ellipsoid: {
            radii: new Cesium.Cartesian3(pos.radius, pos.radius * 0.85, pos.radius * 0.65),
            material: new Cesium.ColorMaterialProperty(
              Cesium.Color.fromCssColorString('#1a4a5a').withAlpha(0.9)
            ),
            outline: true,
            outlineColor: Cesium.Color.fromCssColorString('#00ffff'),
            outlineWidth: 3
          }
        });

        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon, lat, pos.alt + pos.radius * 0.6),
          cylinder: {
            length: 120, topRadius: 1.0, bottomRadius: pos.radius * 0.4,
            material: Cesium.Color.fromCssColorString('#00ffff').withAlpha(0.35)
          }
        });

        floatingIslands.push({ lon, lat, alt: pos.alt, radius: pos.radius, entity: islandEntity });
      });
    }

    createFloatingIslandCluster();

    // 飛行姿態變數
    let planeLon = BASE_LON;
    let planeLat = BASE_LAT;
    let planeAlt = 800.0;
    let heading = 45.0;
    let pitch = 0.0;
    let roll = 0.0;

    // 陀螺儀偏移（抓建築物停棲後用以改變觀看視角）
    let gyroHeadingOffset = 0;
    let gyroPitchOffset = 0;

    let airspeed = 0.00020;
    let stamina = 100.0;
    let isDiving = false;
    let kineticEnergy = 0;

    let isPlaying = false;
    let isPerched = false;
    let canCheckCollision = true;

    function updateCamera() {
      // 若處於停棲狀態，組合原本面向與手機陀螺儀旋轉
      let finalHeading = heading + gyroHeadingOffset;
      let finalPitch = pitch + gyroPitchOffset;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(planeLon, planeLat, planeAlt),
        orientation: {
          heading: Cesium.Math.toRadians(finalHeading),
          pitch: Cesium.Math.toRadians(finalPitch),
          roll: Cesium.Math.toRadians(roll)
        }
      });

      document.getElementById('altTxt').innerText = `${Math.round(planeAlt)} m`;
      document.getElementById('spdTxt').innerText = `${(airspeed * 350000).toFixed(0)} km/h`;
      document.getElementById('staminaBar').style.width = `${stamina}%`;
    }

    updateCamera();

    // 請求陀螺儀權限 (iOS 13+) 與監聽轉動
    function initGyroscope() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    function handleOrientation(event) {
      if (!isPerched) return; // 飛行時主要靠手勢，抓壁停棲時啟用陀螺儀觀賞

      // event.alpha: 0~360 (方位角), event.beta: -180~180 (前後傾斜)
      if (event.alpha !== null) {
        gyroHeadingOffset = (360 - event.alpha) % 360; 
      }
      if (event.beta !== null) {
        gyroPitchOffset = (event.beta - 45) * 0.8; // 將姿勢校正至舒適視角
      }
    }

    // 全螢幕與鎖定橫向
    async function requestFullscreenAndLandscape() {
      try {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          await docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
          await docEl.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape').catch(e => console.log("橫螢幕鎖定受限:", e));
        }
      } catch (err) {
        console.log("全螢幕模式開啟失敗:", err);
      }
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      await requestFullscreenAndLandscape();
      initGyroscope();
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('statusBanner').classList.remove('hidden');
      isPlaying = true;
    });

    // VR 分割模式切換
    let isVRMode = false;
    document.getElementById('vrToggleBtn').addEventListener('click', () => {
      isVRMode = !isVRMode;
      viewer.useDefaultRenderLoop = true;
      viewer.scene.useDepthPicking = true;
      
      if (isVRMode) {
        viewer.scene.vrMode = true;
        document.getElementById('vrToggleBtn').innerText = "📺 離開 VR 模式";
      } else {
        viewer.scene.vrMode = false;
        document.getElementById('vrToggleBtn').innerText = "🥽 切換 VR 分割模式";
      }
    });

    // 抓實山壁/建築物：轉向反方向 (180度) 面向風景
    function triggerPerch(reason = "山壁/建築物") {
      if (isPerched) return;
      isPerched = true;
      canCheckCollision = false;

      // 關鍵設定：強制轉向 180 度看反方向 (背面)
      heading = (heading + 180) % 360;
      pitch = 0.0;
      roll = 0.0;
      gyroHeadingOffset = 0;
      gyroPitchOffset = 0;

      document.getElementById('bannerText').innerHTML = `🐾 爪實${reason}！視角已轉向反方向<br><span style="font-size:13px; color:#00ffff;">轉動手機可 360° 控制視角 | 雙手同時拉下重新起飛</span>`;
      document.getElementById('poseTxt').innerText = `🐾 爪實${reason}觀景中`;
      document.getElementById('poseTxt').style.color = "#00ffff";
    }

    // 彈射起飛
    function launchFromPerch() {
      // 以當前觀看的反方向（即重新朝向前方）起飛
      heading = (heading + gyroHeadingOffset) % 360;
      gyroHeadingOffset = 0;
      gyroPitchOffset = 0;

      isPerched = false;
      document.getElementById('bannerText').innerText = "🦅 彈射起飛！重新翱翔！";
      document.getElementById('poseTxt').innerText = "🦅 翱翔中";
      document.getElementById('poseTxt').style.color = "#00ff00";

      pitch = 15.0; // 爬升
      airspeed = 0.00025;

      setTimeout(() => { canCheckCollision = true; }, 1500);
    }

    // MediaPipe Hands 控制邏輯
    const videoElement = document.getElementById('webcam');
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2, modelComplexity: 1,
      minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
    });

    let lastY = 0.5;
    let flapCooldown = false;

    hands.onResults((results) => {
      if (!isPlaying) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length >= 2) {
        document.getElementById('statusTxt').innerText = "韁繩連結中";
        document.getElementById('statusTxt').style.color = "#00ff00";

        const h1 = results.multiHandLandmarks[0][9];
        const h2 = results.multiHandLandmarks[1][9];
        const avgY = (h1.y + h2.y) / 2;

        // 停棲狀態：兩手向下拉觸發起飛
        if (isPerched) {
          if (avgY > 0.72) {
            launchFromPerch();
          }
          return;
        }

        const handDistance = Math.hypot(h1.x - h2.x, h1.y - h2.y);

        // 俯衝手勢
        if (handDistance < 0.22) {
          isDiving = true;
          document.getElementById('poseTxt').innerText = "🔥 翅膀收攏：極速俯衝！";
          document.getElementById('poseTxt').style.color = "#ff3300";
        } else {
          if (isDiving && pitch < -10) {
            airspeed += kineticEnergy * 0.000008;
            kineticEnergy = 0;
          }
          isDiving = false;
          document.getElementById('poseTxt').innerText = "🦅 展開雙翼：滑翔控制";
          document.getElementById('poseTxt').style.color = "#00e5ff";
        }

        // 拍翅推力
        const deltaY = Math.abs(avgY - lastY);
        if (deltaY > 0.18 && !flapCooldown && stamina >= 15) {
          stamina -= 15;
          airspeed += 0.00012;
          pitch += 8.0;
          flapCooldown = true;
          document.getElementById('bannerText').innerText = "⚡ 翅膀拍擊！獲得瞬間推力！";
          setTimeout(() => { flapCooldown = false; }, 600);
        }
        lastY = avgY;

        // 姿勢轉向
        const dx = h2.x - h1.x;
        const dy = h2.y - h1.y;
        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
        if (angle > 90) angle -= 180;
        if (angle < -90) angle += 180;

        roll = -angle * 1.4;
        pitch = (avgY - 0.5) * 50.0;

      } else {
        document.getElementById('statusTxt').innerText = "尋找雙手手勢...";
        document.getElementById('statusTxt').style.color = "#ffea00";
        if (!isPerched) roll *= 0.85;
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 320, height: 240
    });
    camera.start();

    // 實體碰撞與視覺更新 Loop
    viewer.clock.onTick.addEventListener(() => {
      if (!isPlaying) return;

      if (isPerched) {
        updateCamera(); // 停棲狀態持續依照陀螺儀角度更新視角
        return;
      }

      if (stamina < 100) stamina += 0.08;

      if (isDiving) {
        pitch = -45.0;
        airspeed += 0.000004;
        kineticEnergy += 1.5;
      } else {
        if (pitch < 0) {
          airspeed += Math.abs(pitch) * 0.00000002;
          planeAlt += pitch * 0.25;
        } else {
          airspeed -= pitch * 0.00000003;
          planeAlt += pitch * 0.22;
        }
      }

      airspeed *= 0.994;
      if (airspeed < 0.00008) airspeed = 0.00008;

      heading += roll * 0.06;

      const radH = Cesium.Math.toRadians(heading);
      planeLon += Math.sin(radH) * airspeed;
      planeLat += Math.cos(radH) * airspeed;

      // 精確 3D 碰撞系統
      if (canCheckCollision) {
        // A. 懸浮山碰撞檢測
        for (let island of floatingIslands) {
          const dLon = (planeLon - island.lon) * 111000;
          const dLat = (planeLat - island.lat) * 111000;
          const dist2D = Math.hypot(dLon, dLat);
          const altDiff = Math.abs(planeAlt - island.alt);

          if (dist2D <= island.radius * 0.95 && altDiff <= island.radius * 0.6) {
            triggerPerch("懸浮山壁");
            return;
          }
        }

        // B. 3D 建築物與地面碰撞檢測
        const cartographic = Cesium.Cartographic.fromDegrees(planeLon, planeLat);
        const groundHeight = viewer.scene.sampleHeight(cartographic);

        if (groundHeight !== undefined && planeAlt <= groundHeight + 8.0) {
          planeAlt = groundHeight + 8.0;
          triggerPerch("建築物/地面");
          return;
        }
      }

      updateCamera();
    });
  </script>
</body>
</html>
