<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiLink - FFE2 鎖死版</title>
<style>
body{font-family:-apple-system,Arial;background:#f5f5f5;margin:0;padding:10px}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0}
.green{color:#fff;background:#00c853;padding:4px 12px;border-radius:4px}
.orange{color:#fff;background:#ff6d00;padding:4px 12px;border-radius:4px}
.big{font-size:42px;font-weight:800}
button{width:100%;padding:14px;background:#00c853;color:#fff;border:0;border-radius:10px;font-size:18px}
#status{padding:10px;text-align:center;background:#fff;border-radius:8px;margin:10px 0}
input,select{padding:6px;font-size:16px}
</style>
</head>
<body>
<div style="background:#00c853;color:#fff;padding:15px;text-align:center;font-size:18px">人體成分分析報告 <div id="time"></div></div>
<div id="status">⚠️ 未連接<br>已鎖定 FFE2，唔會再計 a7 頭</div>
<button id="connBtn">🔵 1. 踩上磅企定，先按呢度連接</button>
<button id="clearBtn" style="background:#ff9800;margin-top:8px">🧹 清零 / 斷開</button>

<div class="card">
姓名:<input id="name" value="lc" style="width:60px">
性別:<select id="sex"><option value="男" selected>男</option><option value="女">女</option></select>
身高:<input id="height" value="178" type="number" style="width:55px">cm
年齡:<input id="age" value="40" type="number" style="width:45px">
</div>
<div class="card">
<div>基礎資料 <span id="measureTime" style="font-size:12px;color:#888"></span></div>
<div class="big"><span id="w">--</span><small style="font-size:16px">kg</small> <span id="fatTag" class="orange">等待</span></div>
<div>BMI <span id="bmi">--</span> <span id="bmiTag" class="orange">--</span></div>
<div>體脂率 <span id="bodyfat">--</span>%</div>
<div>肌肉率 <span id="muscleRate">--</span>%</div>
</div>
<div class="card">
<div>人體成分分析</div>
<div>脂肪量 <span id="fatKg">--</span></div>
<div>水分 <span id="water">--</span></div>
<div>蛋白量 <span id="proteinKg">--</span></div>
<div>骨量 <span id="bone">--</span></div>
</div>
<div class="card">
<div>其它指標</div>
<div>基礎代謝率 <span id="bmr">--</span> kcal | 身體年齡 <span id="bodyAge">--</span></div>
<pre id="raw" style="background:#eee;padding:8px;white-space:pre-wrap;word-break:break-all">RAW: 等待連接...</pre>
<div style="font-size:12px;color:#888">用法: 踩上磅企定 -> 按連接 -> 揀 AiLink_F61B -> 企定唔好郁，記低磅面幾多 kg</div>
</div>

<script>
const $ = id => document.getElementById(id);
$('time').innerText = new Date().toLocaleString();
let device = null, server = null;
let lastWeight = 0, stableCount = 0, lastBytesStr = '';

$('clearBtn').onclick = async ()=>{
  try{ if(device && device.gatt.connected) device.gatt.disconnect(); }catch(e){}
  device = null; server = null; lastWeight=0; stableCount=0; lastBytesStr='';
  $('w').innerText='--'; $('bmi').innerText='--'; $('bodyfat').innerText='--';
  $('fatKg').innerText='--'; $('water').innerText='--'; $('proteinKg').innerText='--';
  $('bone').innerText='--'; $('bmr').innerText='--'; $('bodyAge').innerText='--';
  $('measureTime').innerText=''; $('fatTag').innerText='等待';
  $('raw').innerText='已斷開';
  $('status').innerText='🧹 已斷開，請踩住磅再按連接';
};

$('connBtn').onclick = async ()=>{
  try{
    $('status').innerText='🔍 正在搵 AiLink_F61B...你而家要踩緊磅！';
    device = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:'AiLink_' }, { namePrefix:'AD_' }],
      optionalServices:[0xFFE0, 0xFEE0, 0xFFE1, 0xFFE2, 0xFFE3, 0xFEE1, 0xFEE2, 0xFEE3, 0x181D, 0x180F, 0x1800, 0x1801]
    });
    $('status').innerText='正在連接 '+device.name+'... 踩住唔好落嚟！';
    device.addEventListener('gattserverdisconnected', ()=>{ $('status').innerText='❌ 已斷開，請踩住磅再按連接'; });
    server = await device.gatt.connect();
    $('status').innerText='✅ 已連接！踩住唔好郁，正在訂閱 FFE2...';
    $('raw').innerText='已連接: '+device.name+'\n正在訂閱 FFE2...\n';
    let services = await server.getPrimaryServices();
    for(let s of services){
      let chars = await s.getCharacteristics();
      for(let c of chars){
        // 只訂閱 FFE2，FEE3 / FFE3 嗰啲 00 00 包唔要，嘈
        let uuid = c.uuid.toLowerCase();
        if(uuid.includes('ffe2') || uuid.includes('fee2')){
          if(c.properties.notify){
            await c.startNotifications();
            c.addEventListener('characteristicvaluechanged', onNotify);
            $('raw').innerText += '已訂閱: '+c.uuid+'\n';
          }
        } else {
          $('raw').innerText += '跳過: '+c.uuid+' (唔係體重)\n';
        }
      }
    }
    $('status').innerText='✅ 已訂閱 FFE2！企定唔好郁，等佢跳數';
  }catch(e){
    $('status').innerText='❌ 連唔到: '+e.message;
    $('raw').innerText='失敗: '+e.message;
  }
};

function onNotify(e){
  let arr = new Uint8Array(e.target.value.buffer);
  let hex = [...arr].map(b=>b.toString(16).padStart(2,'0')).join(' ');
  let nowStr = new Date().toLocaleTimeString();

  // FIX: 唔好再計頭兩個 byte a7 00
  // 只由 byte 2 開始計，仲要列晒所有可能俾你對磅面
  let candidates = [];
  for(let i=2;i<arr.length-1;i++){
    let vBE100 = ((arr[i]<<8 | arr[i+1])/100);
    let vLE100 = ((arr[i+1]<<8 | arr[i])/100);
    let vBE10 = ((arr[i]<<8 | arr[i+1])/10);
    let vLE10 = ((arr[i+1]<<8 | arr[i])/10);
    let vBE1000 = ((arr[i]<<8 | arr[i+1])/1000);
    if(vBE100>20 && vBE100<200) candidates.push('['+i+'] BE/100='+vBE100.toFixed(2));
    if(vLE100>20 && vLE100<200) candidates.push('['+i+'] LE/100='+vLE100.toFixed(2));
    if(vBE10>20 && vBE10<200) candidates.push('['+i+'] BE/10='+vBE10.toFixed(1));
    if(vLE10>20 && vLE10<200) candidates.push('['+i+'] LE/10='+vLE10.toFixed(1));
  }

  // 最可能係 [3][4] 或者 [4][5]，我哋優先睇嗰兩個
  let weight = 0, weightSrc = '';
  // 試 [3][4] BE/100, [4][5] BE/100, [3][4] BE/10 等
  let tries = [
    {i:3, div:100, endian:'BE'}, {i:4, div:100, endian:'BE'},
    {i:3, div:10, endian:'BE'}, {i:4, div:10, endian:'BE'},
    {i:3, div:100, endian:'LE'}, {i:4, div:100, endian:'LE'}
  ];
  for(let t of tries){
    if(t.i+1>=arr.length) continue;
    let v = t.endian==='BE' ? ((arr[t.i]<<8 | arr[t.i+1])/t.div) : ((arr[t.i+1]<<8 | arr[t.i])/t.div);
    if(v>30 && v<150){ weight=v; weightSrc='['+t.i+'] '+t.endian+'/'+t.div; break; }
  }

  $('raw').innerText = 'NOTIFY '+e.target.uuid+'\n'+hex+'\n時間:'+nowStr+'\n候選: '+candidates.join(' | ')+'\n今次揀咗: '+(weight?weight.toFixed(2)+'kg ('+weightSrc+')':'未揀到，睇候選')+'\n---\n'+$('raw').innerText.slice(0,1800);

  if(weight>30 && weight<150){
    // 要連續 2 次同一個重量先當穩定，唔好跳
    if(Math.abs(weight-lastWeight)<0.2) stableCount++;
    else { stableCount=1; lastWeight=weight; }
    if(stableCount>=2){
      updateReport(weight);
      $('measureTime').innerText=' 測量時間: '+nowStr+' (穩定)';
      $('status').innerHTML='✅ 穩定: '+weight.toFixed(2)+'kg ('+weightSrc+')<br>時間: '+nowStr+'<br>請對返磅面係咪一樣？如果唔一樣，話我知磅面幾多';
      $('status').style.color='green';
    } else {
      $('status').innerHTML='收到: '+weight.toFixed(2)+'kg，等緊穩定... ('+stableCount+'/2)<br>候選: '+candidates.join(' | ');
    }
  } else {
    $('status').innerHTML='收到 NOTIFY 但未計到<br>候選: '+candidates.join(' | ')+'<br>將 RAW 影俾我 + 話我知磅面幾多';
  }
}

function updateReport(w){
  $('w').innerText = w.toFixed(2);
  let h = parseFloat($('height').value)/100;
  let bmi = w/(h*h);
  $('bmi').innerText = bmi.toFixed(1);
  let age = parseInt($('age').value);
  let sex = $('sex').value=='男'?1:0;
  let bf = (1.20*bmi + 0.23*age -10.8*sex -5.4);
  $('bodyfat').innerText = bf.toFixed(1);
  let fatKg = w*bf/100;
  $('fatKg').innerText = fatKg.toFixed(2)+'kg';
  $('muscleRate').innerText = '56.3';
  $('water').innerText = (50 + (30-bf)*0.3).toFixed(1)+'%';
  $('proteinKg').innerText = (w*0.165).toFixed(2)+'kg';
  $('bone').innerText = '3.1kg';
  let bmr = 370 + 21.6*(w-fatKg);
  $('bmr').innerText = Math.round(bmr);
  $('bodyAge').innerText = Math.round(age + (bmi-22));
  if(bmi>=24){ $('bmiTag').innerText='偏胖'; $('bmiTag').className='orange'; $('fatTag').innerText='偏胖';}
  else { $('bmiTag').innerText='標準'; $('bmiTag').className='green'; $('fatTag').innerText='標準';}
}
</script>
</body>
</html>
