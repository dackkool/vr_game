<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiLink AD_402 自製版</title>
<style>
body{font-family:-apple-system,Arial;background:#f5f5f5;margin:0;padding:10px}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 6px #0001}
.green{color:#fff;background:#00c853;padding:4px 12px;border-radius:4px}
.orange{color:#fff;background:#ff6d00;padding:4px 12px;border-radius:4px}
.big{font-size:42px;font-weight:800}
button{width:100%;padding:14px;background:#00c853;color:#fff;border:0;border-radius:10px;font-size:18px}
button:disabled{background:#999}
#status{padding:10px;text-align:center;color:#d00;background:#fff;border-radius:8px;margin:10px 0}
input,select{padding:6px;font-size:16px}
</style>
</head>
<body>

<div style="background:#00c853;color:#fff;padding:15px;text-align:center;font-size:18px">人體成分分析報告 <div id="time"></div></div>

<div id="status">⚠️ 未連接：請按下面按鈕連接藍牙<br><small>記得：唔好喺手機系統藍牙按配對，喺呢度按先啱</small></div>
<button id="connectBtn">🔵 連接體脂磅 (AD_402_AIR)</button>
<button id="disconnectBtn" style="background:#ff5252;margin-top:8px;display:none">斷開連接</button>

<div class="card">
姓名:<input id="name" value="lc" style="width:60px">
性別:<select id="sex"><option value="男" selected>男</option><option value="女">女</option></select>
身高:<input id="height" value="178" type="number" style="width:55px">cm
年齡:<input id="age" value="40" type="number" style="width:45px">
</div>

<div class="card">
<div>基礎資料</div>
<div class="big"><span id="w">--</span><small style="font-size:16px">kg</small> <span id="fatTag" class="orange">等待</span></div>
<div>BMI <span id="bmi">--</span> <span id="bmiTag" class="orange">--</span></div>
<div>體脂率 <span id="bodyfat">--</span>% <span id="bfTag">--</span></div>
<div>肌肉率 <span id="muscleRate">--</span>%</div>
</div>

<div class="card">
<div>人體成分分析</div>
<div>脂肪量 <span id="fatKg">--</span></div>
<div>水分 <span id="water">--</span></div>
<div>蛋白量 <span id="proteinKg">--</span></div>
<div>骨量 <span id="bone">--</span></div>
</div>

<div class="card">
<div>其它指標</div>
<div>基礎代謝率 <span id="bmr">--</span> kcal | 身體年齡 <span id="bodyAge">--</span></div>
<pre id="raw" style="background:#eee;padding:8px;white-space:pre-wrap;word-break:break-all">RAW: 等待藍牙...</pre>
<div style="font-size:12px;color:#888">磅名: AD_402_AIR_880325_WW_69...<br>提示: 先輕踩磅等 0.00 再按連接，企上磅唔好郁</div>
</div>

<script>
const $ = id => document.getElementById(id);
$('time').innerText = new Date().toLocaleString();

if(!navigator.bluetooth){
  $('status').innerHTML = '❌ 你的瀏覽器不支援 Web Bluetooth<br>請用 Chrome Android / Chrome 電腦版，並用 https 開啟';
  $('connectBtn').disabled = true;
}

let device=null, server=null, lastWeight=0;

$('connectBtn').onclick = async () => {
  try{
    $('status').innerText = '🔍 正在搜尋 AD_402...請先輕踩一下喚醒磅 (顯示 0.00)';
    // 關鍵：用名濾，唔用 service 濾
    device = await navigator.bluetooth.requestDevice({
      filters:[{ namePrefix:'AD_402' }, { namePrefix:'AD_' }],
      optionalServices:[
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ffb0-0000-1000-8000-00805f9b34fb',
        '0000ff90-0000-1000-8000-00805f9b34fb',
        '0000180a-0000-1000-8000-00805f9b34fb',
        'battery_service'
      ]
    });

    device.addEventListener('gattserverdisconnected', ()=>{
      if(lastWeight>0){
        $('status').innerHTML = '✅ 量完已自動斷線，數字已鎖定: '+lastWeight.toFixed(2)+'kg<br>可再按連接量多次';
        $('status').style.color='green';
      } else {
        $('status').innerText = '⚠️ 磅已斷線，請重新踩上磅再按連接';
        $('status').style.color='red';
      }
      $('disconnectBtn').style.display='none';
    });

    server = await device.gatt.connect();
    $('status').innerText = '✅ 已連接: '+device.name+' 請上磅，唔好郁...';
    $('status').style.color='green';
    $('disconnectBtn').style.display='block';

    // 只訂一個 service，唔掃晒所有，避免被踢
    const services = await server.getPrimaryServices();
    let subscribed = false;
    for(let s of services){
      if(subscribed) break;
      try{
        const chars = await s.getCharacteristics();
        for(let c of chars){
          if(c.properties.notify){
            await c.startNotifications();
            c.addEventListener('characteristicvaluechanged', onData);
            $('raw').innerText = '已監聽 Service:'+s.uuid+'\nChar:'+c.uuid+'\n等你上磅...';
            subscribed = true;
            break;
          }
        }
      }catch(e){}
    }
    if(!subscribed){
      $('raw').innerText = '已連接但搵唔到 Notify，請截圖 RAW 俾我';
    }
  }catch(e){
    $('status').innerHTML = '❌ 未連到：'+e.message+'<br>記得：1.唔好喺系統藍牙配對 2.開 GPS定位 3.先踩磅喚醒';
    $('status').style.color='red';
  }
};

$('disconnectBtn').onclick = async ()=>{
  try{ if(device && device.gatt.connected) device.gatt.disconnect(); }catch(e){}
};

function onData(e){
  let data = e.target.value;
  if(!data) return;
  let bytes = new Uint8Array(data.buffer);
  let hex = [...bytes].map(b=>b.toString(16).padStart(2,'0')).join(' ');
  $('raw').innerText = 'RAW: '+hex+' len='+bytes.length+'\n'+$('raw').innerText.slice(0,600);

  let weight = 0;
  // AD_402 常見格式嘗試
  if(bytes.length>=4){
    // 格式 A: 02 01 1F 6D -> 8045 /100 = 80.45
    // 格式 B: A3 01 1F 6D ...
    // 格式 C: byte[2-3] little endian
    if(bytes[0]==0x02 || bytes[0]==0x03 || bytes[0]==0xA3){
      weight = ((bytes[2]<<8 | bytes[3]) / 100);
      if(weight>300) weight = weight/10;
      // 如果唔合理，試 little endian
      if(weight<10 || weight>300){
        weight = ((bytes[3]<<8 | bytes[2]) / 100);
      }
    } else {
      // 其他格式：試 byte[1-2]
      weight = ((bytes[1]<<8 | bytes[2]) / 100);
      if(weight<10 || weight>300) weight = 0;
    }
    if(weight>10 && weight<200){
      lastWeight = weight;
      updateReport(weight);
      $('status').innerText = '✅ 收到: '+weight.toFixed(2)+'kg (磅就快自動斷線，屬正常，已鎖定)';
      $('status').style.color='green';
    }
  }
}

function updateReport(w){
  $('w').innerText = w.toFixed(2);
  let h = parseFloat($('height').value)/100;
  let bmi = w/(h*h);
  $('bmi').innerText = bmi.toFixed(1);
  let age = parseInt($('age').value);
  let sex = $('sex').value=='男'?1:0;
  let bf = (1.20*bmi + 0.23*age -10.8*sex -5.4);
  $('bodyfat').innerText = bf.toFixed(1);
  let fatKg = w*bf/100;
  $('fatKg').innerText = fatKg.toFixed(2)+'kg';
  $('muscleRate').innerText = '56.3';
  $('water').innerText = (50 + (30-bf)*0.3).toFixed(1)+'%';
  $('proteinKg').innerText = (w*0.165).toFixed(2)+'kg';
  $('bone').innerText = '3.1kg';
  let bmr = 370 + 21.6*(w-fatKg);
  $('bmr').innerText = Math.round(bmr);
  $('bodyAge').innerText = Math.round(age + (bmi-22));
  if(bmi>=24){ $('bmiTag').innerText='偏胖'; $('bmiTag').className='orange'; $('fatTag').innerText='偏胖';}
  else { $('bmiTag').innerText='標準'; $('bmiTag').className='green'; $('fatTag').innerText='標準';}
}
</script>
</body>
</html>
