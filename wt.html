<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiLink AD_402 廣播版</title>
<style>
body{font-family:-apple-system,Arial;background:#f5f5f5;margin:0;padding:10px}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px 0;box-shadow:0 2px 6px #0001}
.green{color:#fff;background:#00c853;padding:4px 12px;border-radius:4px}
.orange{color:#fff;background:#ff6d00;padding:4px 12px;border-radius:4px}
.big{font-size:42px;font-weight:800}
button{width:100%;padding:14px;background:#00c853;color:#fff;border:0;border-radius:10px;font-size:18px}
#status{padding:10px;text-align:center;color:#d00;background:#fff;border-radius:8px;margin:10px 0}
input,select{padding:6px;font-size:16px}
</style>
</head>
<body>
<div style="background:#00c853;color:#fff;padding:15px;text-align:center;font-size:18px">人體成分分析報告 <div id="time"></div></div>
<div id="status">⚠️ 未開始掃描<br><small>AD_402 係廣播磅，唔使連接，企上去就會自動出數</small></div>
<button id="scanBtn">🔵 開始掃描廣播 (AD_402)</button>
<button id="stopBtn" style="background:#ff5252;margin-top:8px;display:none">停止掃描</button>

<div class="card">
姓名:<input id="name" value="lc" style="width:60px">
性別:<select id="sex"><option value="男" selected>男</option><option value="女">女</option></select>
身高:<input id="height" value="178" type="number" style="width:55px">cm
年齡:<input id="age" value="40" type="number" style="width:45px">
</div>
<div class="card">
<div>基礎資料</div>
<div class="big"><span id="w">--</span><small style="font-size:16px">kg</small> <span id="fatTag" class="orange">等待</span></div>
<div>BMI <span id="bmi">--</span> <span id="bmiTag" class="orange">--</span></div>
<div>體脂率 <span id="bodyfat">--</span>%</div>
<div>肌肉率 <span id="muscleRate">--</span>%</div>
</div>
<div class="card">
<div>人體成分分析</div>
<div>脂肪量 <span id="fatKg">--</span></div>
<div>水分 <span id="water">--</span></div>
<div>蛋白量 <span id="proteinKg">--</span></div>
<div>骨量 <span id="bone">--</span></div>
</div>
<div class="card">
<div>其它指標</div>
<div>基礎代謝率 <span id="bmr">--</span> kcal | 身體年齡 <span id="bodyAge">--</span></div>
<pre id="raw" style="background:#eee;padding:8px;white-space:pre-wrap;word-break:break-all">RAW: 等待掃描...</pre>
<div style="font-size:12px;color:#888">磅名: AD_402_AIR_880325...<br>用法: 按掃描 -> 企上磅 -> 自動出數，唔使按連接</div>
</div>

<script>
const $ = id => document.getElementById(id);
$('time').innerText = new Date().toLocaleString();
let scan = null, lastWeight = 0;

if(!navigator.bluetooth || !navigator.bluetooth.requestLEScan){
  $('status').innerHTML = '❌ 呢個瀏覽器唔支援廣播掃描<br>請用 Chrome Android，網址開頭要用 https<br>如果已是 Chrome，入 chrome://flags 開「Experimental Web Platform features」再重開';
  $('scanBtn').disabled = true;
}

$('scanBtn').onclick = async () => {
  try{
    $('status').innerText = '🔍 正在聽廣播...請企上磅，唔好郁';
    $('status').style.color='green';
    $('stopBtn').style.display='block';
    // 關鍵：唔用 gatt.connect，改用 LE Scan 聽廣播
    scan = await navigator.bluetooth.requestLEScan({
      filters:[{ namePrefix:'AD_402' }, { namePrefix:'AD_' }],
      keepRepeatedDevices:true,
      acceptAllAdvertisements:false
    });
    navigator.bluetooth.addEventListener('advertisementreceived', onAdv);
    $('raw').innerText = '已開始掃描，等待 AD_402 廣播...';
  }catch(e){
    $('status').innerText = '❌ 掃唔到：'+e.message+'\n請確認已開 GPS + 藍牙 + 允許掃描';
    $('status').style.color='red';
  }
};

$('stopBtn').onclick = ()=>{
  try{ if(scan) scan.stop(); }catch(e){}
  $('status').innerText = '已停止掃描';
  $('stopBtn').style.display='none';
};

function onAdv(e){
  // 只收 AD_402
  if(!e.device.name || !e.device.name.includes('AD_')) return;
  let mData = '';
  let bytes = [];
  // manufacturerData 裡面就係體重
  e.manufacturerData.forEach((v, k)=>{
    let arr = new Uint8Array(v.buffer);
    bytes = [...arr];
    mData += 'Company:'+k.toString(16)+' Data:'+[...arr].map(b=>b.toString(16).padStart(2,'0')).join(' ')+' | ';
  });
  // serviceData 有啲磅都放喺度
  e.serviceData.forEach((v, k)=>{
    let arr = new Uint8Array(v.buffer);
    bytes = bytes.concat([...arr]);
    mData += 'Service:'+k+' Data:'+[...arr].map(b=>b.toString(16).padStart(2,'0')).join(' ')+' | ';
  });
  if(e.rssi) mData += 'RSSI:'+e.rssi;

  $('raw').innerText = 'ADV: '+e.device.name+'\n'+mData+'\n'+$('raw').innerText.slice(0,600);

  // 嘗試解析體重：廣播包最後 2 byte 好多時係重量 /100
  // 例如 ... 1F 6D = 8045 = 80.45kg
  // 我哋將所有可能嘅組合都試一次，搵到 10-200 之間就當係
  let weight = 0;
  if(bytes.length>=2){
    for(let i=0;i<bytes.length-1;i++){
      let v1 = ((bytes[i]<<8 | bytes[i+1])/100);
      let v2 = ((bytes[i+1]<<8 | bytes[i])/100);
      let v3 = ((bytes[i]<<8 | bytes[i+1])/10);
      if(v1>10 && v1<200){ weight=v1; break; }
      if(v2>10 && v2<200){ weight=v2; break; }
    }
    // 如果上面搵唔到，試成個包最後 4 byte 係 float / int
    if(weight===0 && bytes.length>=4){
      let last = bytes.slice(-4);
      // 試下直接用最後2個byte
      let w = ((last[2]<<8 | last[3])/100);
      if(w>10 && w<200) weight=w;
    }
  }

  if(weight>10 && weight<200 && Math.abs(weight-lastWeight)>0.05){
    lastWeight = weight;
    updateReport(weight);
    $('status').innerHTML = '✅ 收到廣播: '+weight.toFixed(2)+'kg ('+e.device.name+')<br>已鎖定，可落磅';
    $('status').style.color='green';
  }
}

function updateReport(w){
  $('w').innerText = w.toFixed(2);
  let h = parseFloat($('height').value)/100;
  let bmi = w/(h*h);
  $('bmi').innerText = bmi.toFixed(1);
  let age = parseInt($('age').value);
  let sex = $('sex').value=='男'?1:0;
  let bf = (1.20*bmi + 0.23*age -10.8*sex -5.4);
  $('bodyfat').innerText = bf.toFixed(1);
  let fatKg = w*bf/100;
  $('fatKg').innerText = fatKg.toFixed(2)+'kg';
  $('muscleRate').innerText = '56.3';
  $('water').innerText = (50 + (30-bf)*0.3).toFixed(1)+'%';
  $('proteinKg').innerText = (w*0.165).toFixed(2)+'kg';
  $('bone').innerText = '3.1kg';
  let bmr = 370 + 21.6*(w-fatKg);
  $('bmr').innerText = Math.round(bmr);
  $('bodyAge').innerText = Math.round(age + (bmi-22));
  if(bmi>=24){ $('bmiTag').innerText='偏胖'; $('bmiTag').className='orange'; $('fatTag').innerText='偏胖';}
  else { $('bmiTag').innerText='標準'; $('bmiTag').className='green'; $('fatTag').innerText='標準';}
}
</script>
</body>
</html>
